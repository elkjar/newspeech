<script>
(function () {
"use strict";

// ---------- model: .seq json -> rows (sections) + lanes (voices) ----------

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function stepsPerBar(rate) {
  // rate is a string like "1/16"; denominator = steps per bar
  const m = /^1\/(\d+)$/.exec(String(rate || ""));
  const n = m ? parseInt(m[1], 10) : 16;
  return (n >= 1 && n <= 64) ? n : 16;
}

function trackBars(t) {
  const len = t.length || (t.steps || []).length || 16;
  return Math.max(1, Math.ceil(len / stepsPerBar(t.rate)));
}

// muted tracks still count — they render as ghosts (authored material, reduced weight)
function hasHits(t) {
  return t && Array.isArray(t.steps) &&
    t.steps.slice(0, t.length || t.steps.length).some(s => s && s.on);
}

function stepPitches(s) {
  if (Array.isArray(s.notes) && s.notes.length) return s.notes;
  return [s.pitch || 0];
}

function rowMuted(row, laneId, laneIndex) {
  return row.mutes.some(m => m === laneId || m === laneIndex);
}

// build the row timeline: arrangement rows -> banks in order -> live tracks
function buildModel(d, filename) {
  const banks = (d.banks || []).map(b => b && b.tracks ? b.tracks : null);
  let rows = [];

  const arrRows = ((d.arrangement && d.arrangement.rows) || []).filter(r => r && r.bank != null && banks[r.bank]);
  if (arrRows.length) {
    rows = arrRows.map(r => ({ bank: r.bank, tracks: banks[r.bank], bars: Math.max(1, r.bars | 0), mutes: r.mutes || [] }));
  } else {
    banks.forEach((tracks, i) => {
      if (!tracks || !tracks.some(hasHits)) return;
      const bars = Math.max(...tracks.filter(hasHits).map(trackBars));
      rows.push({ bank: i, tracks, bars, mutes: [] });
    });
  }
  if (!rows.length && Array.isArray(d.tracks) && d.tracks.some(hasHits)) {
    const bars = Math.max(...d.tracks.filter(hasHits).map(trackBars));
    rows = [{ bank: 0, tracks: d.tracks, bars, mutes: [] }];
  }
  if (!rows.length) return null;

  // lanes = every track active in any used row, in t1..t16 order
  const laneMap = new Map();
  for (const row of rows) {
    for (let i = 0; i < row.tracks.length; i++) {
      const t = row.tracks[i];
      if (!hasHits(t)) continue;
      if (!laneMap.has(t.id)) {
        laneMap.set(t.id, { id: t.id, index: i, section: t.section || "drum", pmin: Infinity, pmax: -Infinity });
      }
      const lane = laneMap.get(t.id);
      if ((t.section || "drum") !== "drum") {
        for (const s of t.steps.slice(0, t.length)) {
          if (!s || !s.on) continue;
          for (const p of stepPitches(s)) {
            if (p < lane.pmin) lane.pmin = p;
            if (p > lane.pmax) lane.pmax = p;
          }
        }
      }
    }
  }
  const lanes = [...laneMap.values()].sort((a, b) => a.index - b.index);
  if (!lanes.length) return null;

  const totalBars = rows.reduce((n, r) => n + r.bars, 0);
  const root = d.rootNote != null ? NOTE_NAMES[((d.rootNote % 12) + 12) % 12] : null;
  return {
    name: (d.name || filename.replace(/\.seq$/i, "")).toUpperCase(),
    bpm: d.bpm || null,
    key: root ? root + " " + String(d.scale || "").toUpperCase() : null,
    rows, lanes, totalBars,
  };
}

// ---------- shared chrome (title block + footer) ----------

const INK  = { bg: "#050505", ink: "#e2e2e2" };
const PAPER = { bg: "#f2efe9", ink: "#181818" };

// output formats: logical canvas dimensions per aspect. pad = safe-area
// insets (9:16 keeps the text clear of instagram's top/bottom chrome).
const FORMATS = {
  "1:1":  { w: 1680, h: 1680, pad: [0, 0] },
  "4:5":  { w: 1344, h: 1680, pad: [0, 0] },
  "9:16": { w: 945,  h: 1680, pad: [210, 295] },
  "16:9": { w: 1680, h: 945,  pad: [0, 0] },
};

function inker(ctx, theme) {
  return (a) => { ctx.globalAlpha = a; ctx.strokeStyle = theme.ink; ctx.fillStyle = theme.ink; };
}

function drawChrome(ctx, model, theme, filename, W, H, marginL, pad) {
  if (clean) return;   // clean mode: figure only, no text anywhere
  const [padT, padB] = pad || [0, 0];
  const ink = inker(ctx, theme);
  const avail = W - marginL - 54;
  try { ctx.letterSpacing = "8px"; } catch (_) {}
  ink(0.95);
  let size = 42;
  ctx.font = size + "px zxx-bold, monospace";
  const tw = ctx.measureText(model.name).width;
  if (tw > avail) {
    size = Math.max(18, Math.floor(size * avail / tw));
    ctx.font = size + "px zxx-bold, monospace";
  }
  ctx.fillText(model.name, marginL, padT + 74);
  try { ctx.letterSpacing = "3px"; } catch (_) {}
  ink(0.5);
  const seq = model.rows.map(r => String.fromCharCode(65 + r.bank) + r.bars);
  const facts = [
    model.bpm && model.bpm + " BPM",
    model.key,
    model.totalBars + " BARS",
    model.lanes.length + " VOICES",
  ].filter(Boolean);
  // fit the meta line: shrink first, then trim the section sequence, then drop it
  let meta = "";
  fit: for (let fs = 13; fs >= 10; fs--) {
    ctx.font = fs + "px zxx-sans, monospace";
    for (let n = Math.min(seq.length, 14); n >= 0; n -= (n > 4 ? 2 : n)) {
      const tail = n === 0 ? [] : [seq.slice(0, n).join(" ") + (n < seq.length ? " …" : "")];
      meta = facts.concat(tail).join("   ·   ");
      if (ctx.measureText(meta).width <= avail) break fit;
      if (n === 0) break;
    }
  }
  ctx.fillText(meta, marginL, padT + 104);
  try { ctx.letterSpacing = "0px"; } catch (_) {}

  ink(0.3);
  ctx.font = "12px zxx-sans, monospace";
  ctx.fillText(filename + "   ·   " + new Date().toISOString().slice(0, 10), marginL, H - padB - 30);
  try { ctx.letterSpacing = "4px"; } catch (_) {}
  ink(0.5);
  ctx.font = "14px zxx-noise, monospace";
  const w = ctx.measureText("newspeech").width;
  ctx.fillText("newspeech", W - 54 - w, H - padB - 30);
  try { ctx.letterSpacing = "0px"; } catch (_) {}
  ctx.globalAlpha = 1;
}

// ---------- view 1: figures — each section becomes a geometric figure ----------
//
// every voice's pattern is placed around a circle (one ring per voice) and its
// hits are joined in time order: a four-on-the-floor kick is literally a square,
// offbeat hats a rotated square, syncopation an irregular polygon. melodic
// voices bend their ring with pitch, so a melody is a closed angular loop.
// nothing is random — the same .seq always draws the same figures.

const FIG_HEAD = 150, FIG_FOOT = 72, FIG_ML = 54, FIG_ROWGAP = 46;

// sections wrap into up to 4 rows (reading order = piece order). one global
// fit factor across all rows so a bank draws the same size wherever it
// appears — radius still tracks sqrt(bars). y coordinates are body-local
// (0 at the first row) so renderFigures can scale the block into any format.
function figureLayout(model, W) {
  const scoreW = W - FIG_ML * 2;
  const gap = 34;
  const n = model.rows.length;
  const nRows = Math.min(4, n);
  const perRow = Math.floor(n / nRows), extra = n % nRows;

  // slice sections into rows, most-loaded rows first
  const groups = [];
  let idx = 0;
  for (let i = 0; i < nRows; i++) {
    const count = perRow + (i < extra ? 1 : 0);
    groups.push(model.rows.slice(idx, idx + count).map((row, j) => ({
      row, rowIndex: idx + j, R: 52 + 30 * Math.sqrt(row.bars),
    })));
    idx += count;
  }

  const width = (g) => g.reduce((s, c) => s + 2 * c.R, 0) + gap * (g.length - 1);
  const fit = Math.min(1, ...groups.map(g => scoreW / width(g)));

  let y = 0;
  const bands = groups.map(g => {
    const total = width(g) * fit;
    let x = FIG_ML + (scoreW - total) / 2;
    const clusters = g.map(c => {
      const r = c.R * fit;
      const cl = { cx: x + r, r, row: c.row, rowIndex: c.rowIndex };
      x += 2 * r + gap * fit;
      return cl;
    });
    const maxR = Math.max(...clusters.map(c => c.r));
    const cy = y + maxR;
    y += maxR * 2 + 30 + FIG_ROWGAP;   // 30 = label clearance under the figures
    return { clusters, cy, maxR };
  });

  return { bands, bodyH: y - FIG_ROWGAP };
}

// draw one section's figure at (cx, cy) radius r, optionally rotated/faded.
// opts.r0/r1 confine the voice rings to a radial band (default 0.30r..0.96r).
function drawSectionFigure(ctx, theme, model, row, cx, cy, r, opts) {
  const rot = (opts && opts.rot) || 0;
  const alphaScale = (opts && opts.alpha) || 1;
  const bandR0 = (opts && opts.r0 != null) ? opts.r0 : r * 0.30;
  const bandR1 = (opts && opts.r1 != null) ? opts.r1 : r * 0.96;
  const ink = inker(ctx, theme);

  const voices = model.lanes
    .map(l => ({ lane: l, t: row.tracks[l.index] }))
    .filter(v => v.t && v.t.id === v.lane.id && hasHits(v.t));
  const K = voices.length;
  const radialSpan = bandR1 - bandR0;
  // squeeze the marks when the band gets thin (rings view slivers)
  const dotScale = Math.max(0.25, Math.min(1, (radialSpan / Math.max(K, 2)) / 9));

  // pass 1: geometry for every voice
  const geo = voices.map((v, k) => {
    const t = v.t;
    const ghost = (t.mute || rowMuted(row, v.lane.id, v.lane.index)) ? 0.15 : 1;
    const ringR = bandR0 + radialSpan * (k + 1) / K;
    const band = (radialSpan / Math.max(K, 2)) * 0.9;
    const N = t.length || t.steps.length;
    const isDrum = (t.section || "drum") === "drum";

    const pts = [];
    const span = Math.max(1, v.lane.pmax - v.lane.pmin);
    for (let i = 0; i < N; i++) {
      const s = t.steps[i];
      if (!s || !s.on) continue;
      const ang = -Math.PI / 2 + rot + ((i + (s.microTiming || 0)) / N) * Math.PI * 2;
      const p = stepPitches(s)[0];
      const rr = isDrum ? ringR : ringR + (((p - v.lane.pmin) / span) - 0.5) * band;
      pts.push({
        x: cx + Math.cos(ang) * rr,
        y: cy + Math.sin(ang) * rr,
        ang, rr,
        tfrac: i / N,   // musical position in the loop (micro-timing excluded so coincidence matching stays exact)
        vel: Math.max(0, Math.min(1, s.velocity == null ? 1 : s.velocity)),
        prob: (s.probability == null ? 100 : s.probability) / 100,
        ratchet: Math.max(1, s.ratchet | 0),
        gate: s.gate || 1,
      });
    }
    return { pts, ghost, N, isDrum };
  }).filter(g => g.pts.length);

  // cross-voice chords (drawn first, under everything): hits landing at the
  // same position of their loops brace the rings together — where the groove
  // locks, the figure gets structure
  const coincident = new Map();
  geo.forEach((g, gi) => {
    for (const p of g.pts) {
      const key = Math.round(p.tfrac * 1920);
      if (!coincident.has(key)) coincident.set(key, []);
      coincident.get(key).push({ p, ghost: g.ghost, gi });
    }
  });
  ctx.lineWidth = 1;
  for (const group of coincident.values()) {
    if (group.length < 2 || !group.some(e => e.gi !== group[0].gi)) continue;
    group.sort((a, b) => a.p.rr - b.p.rr);
    for (let i = 1; i < group.length; i++) {
      const a = group[i - 1], b = group[i];
      ink(0.11 * (0.4 + 0.6 * Math.min(a.p.vel, b.p.vel)) * Math.min(a.ghost, b.ghost) * alphaScale);
      ctx.beginPath();
      ctx.moveTo(a.p.x, a.p.y);
      ctx.lineTo(b.p.x, b.p.y);
      ctx.stroke();
    }
  }

  // pass 2: per-voice sustain arcs, polygon, vertices
  for (const g of geo) {
    const { pts, ghost, N, isDrum } = g;

    // sustains: a melodic note held longer than a step sweeps its gate as an
    // arc at its pitch radius — long pads wrap the ring as horizon lines
    if (!isDrum) {
      for (const p of pts) {
        if (p.gate < 1.5) continue;
        const sweep = (Math.min(p.gate, N * 0.98) / N) * Math.PI * 2;
        ink(0.28 * p.prob * ghost * alphaScale);
        ctx.lineWidth = 0.8 + 1.2 * p.vel;
        ctx.beginPath();
        ctx.arc(cx, cy, p.rr, p.ang, p.ang + sweep);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    }

    // the polygon: hits joined in time order, closed (the pattern loops)
    ink(0.34 * ghost * alphaScale);
    ctx.lineWidth = 1;
    const dashed = pts.some(p => p.prob < 1);
    if (dashed) ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (pts.length > 2) ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    // vertices: weight = velocity; ratchets tick outward
    for (const p of pts) {
      ink((0.35 + 0.6 * p.vel) * (0.4 + 0.6 * p.prob) * ghost * alphaScale);
      ctx.beginPath();
      ctx.arc(p.x, p.y, (1.2 + 2.6 * p.vel) * dotScale, 0, Math.PI * 2);
      ctx.fill();
      if (p.ratchet > 1) {
        ctx.lineWidth = 1;
        for (let q = 0; q < p.ratchet; q++) {
          const a2 = p.ang + (q - (p.ratchet - 1) / 2) * 0.05;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a2) * (p.rr + 4 * dotScale), cy + Math.sin(a2) * (p.rr + 4 * dotScale));
          ctx.lineTo(cx + Math.cos(a2) * (p.rr + 9 * dotScale), cy + Math.sin(a2) * (p.rr + 9 * dotScale));
          ctx.stroke();
        }
      }
    }
  }
}

function renderFigures(canvas, model, theme, scale, filename, W, H, pad) {
  const [padT, padB] = pad;
  const { bands, bodyH } = figureLayout(model, W);

  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);
  const ink = inker(ctx, theme);

  // fit the block of rows into the frame, centered
  const availH = H - padT - FIG_HEAD - FIG_FOOT - padB;
  const s = Math.min(1, availH / bodyH);
  ctx.save();
  ctx.translate(W * (1 - s) / 2, padT + FIG_HEAD + Math.max(0, (availH - bodyH * s) / 2));
  ctx.scale(s, s);

  for (const band of bands) {
    // faint axis through each row of figures — the timeline reduced to a rule
    ink(0.07);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(FIG_ML, band.cy);
    ctx.lineTo(W - FIG_ML, band.cy);
    ctx.stroke();

    for (const { cx, r, row } of band.clusters) {
      // outer guide circle
      ink(0.09);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, band.cy, r, 0, Math.PI * 2);
      ctx.stroke();

      drawSectionFigure(ctx, theme, model, row, cx, band.cy, r);

      // bank letter + bars beneath the figure
      if (!clean) {
        ink(0.45);
        ctx.font = "12px zxx-sans, monospace";
        const label = String.fromCharCode(65 + row.bank) + " · " + row.bars;
        const lw = ctx.measureText(label).width;
        ctx.fillText(label, cx - lw / 2, band.cy + band.maxR + 20);
      }
    }
  }

  ctx.restore();
  drawChrome(ctx, model, theme, filename, W, H, FIG_ML, pad);
}

// ---------- view 2: composition — the whole piece as one figure ----------
//
// every section overlaid at a single center, each rotated to where it occurs
// in the piece (cumulative bars -> angle). the song wraps once around the
// circle: repeats of a bank re-enter as rotated echoes of the same shape,
// contrast sections cut across them. density is the arrangement.

function renderComposition(canvas, model, theme, scale, filename, W, H, pad) {
  const [padT, padB] = pad;
  const availH = H - padT - FIG_HEAD - FIG_FOOT - padB;
  const cx = W / 2;
  const cy = padT + FIG_HEAD + availH / 2;
  const r = Math.min(availH / 2, W / 2 - FIG_ML) - 44;

  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);
  const ink = inker(ctx, theme);

  // one guide circle
  ink(0.09);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  let barsBefore = 0;
  ctx.font = "12px zxx-sans, monospace";
  model.rows.forEach((row) => {
    const rot = (barsBefore / model.totalBars) * Math.PI * 2;
    drawSectionFigure(ctx, theme, model, row, cx, cy, r, { rot, alpha: 0.8 });

    // entry mark: bank letter just outside the rim where this section begins
    if (!clean) {
      const a = -Math.PI / 2 + rot;
      ink(0.4);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (r + 4), cy + Math.sin(a) * (r + 4));
      ctx.lineTo(cx + Math.cos(a) * (r + 14), cy + Math.sin(a) * (r + 14));
      ctx.stroke();
      const label = String.fromCharCode(65 + row.bank);
      const lw = ctx.measureText(label).width;
      ctx.fillText(label, cx + Math.cos(a) * (r + 26) - lw / 2, cy + Math.sin(a) * (r + 26) + 4);
    }
    barsBefore += row.bars;
  });

  drawChrome(ctx, model, theme, filename, W, H, FIG_ML, pad);
}

// ---------- view: stack — the piece as a wireframe tower ----------
//
// implied 3d: every section figure is a flat disc, so an axonometric
// projection of it is just an affine squash. sections stack bottom (start)
// to top (end), spacing tracks bars; higher discs shrink and fade slightly
// for depth, silhouette rails run up the sides.

const STACK_SQUASH = 0.28;

function renderStack(canvas, model, theme, scale, filename, W, H, pad) {
  const [padT, padB] = pad;
  const availH = H - padT - FIG_HEAD - FIG_FOOT - padB;
  const cx = W / 2;

  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, W, H);
  const ink = inker(ctx, theme);

  const n = model.rows.length;
  const R = Math.min((W - FIG_ML * 2) * 0.34, availH * 0.30);
  const discH = R * STACK_SQUASH;
  const top = padT + FIG_HEAD + discH + 14;
  const bottom = padT + FIG_HEAD + availH - discH - 26;

  // vertical position: cumulative bars, bottom = start of the piece
  const starts = [];
  let acc = 0;
  for (const row of model.rows) { starts.push(acc); acc += row.bars; }
  const lastStart = starts[n - 1] || 1;
  const discs = model.rows.map((row, i) => {
    const t = n === 1 ? 0 : starts[i] / lastStart;          // 0 bottom .. 1 top
    return {
      row,
      cy: bottom - (bottom - top) * t,
      s: 1 - 0.16 * t,                                      // perspective shrink
      fade: 1 - 0.25 * t,                                    // depth fade
    };
  });

  // central axis + silhouette rails
  ink(0.05);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, bottom + discH);
  ctx.lineTo(cx, top - discH);
  ctx.stroke();
  for (const side of [-1, 1]) {
    ink(0.10);
    ctx.beginPath();
    discs.forEach((d, i) => {
      const x = cx + side * R * d.s, y = d.cy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // discs, earliest (bottom) first
  ctx.font = "11px zxx-sans, monospace";
  discs.forEach((d) => {
    // rim ellipse
    ink(0.10 * d.fade);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, d.cy, R * d.s, R * d.s * STACK_SQUASH, 0, 0, Math.PI * 2);
    ctx.stroke();

    // the section figure, squashed onto the disc plane. the squash optically
    // thins every stroke, so the alpha runs a little hot to compensate
    ctx.save();
    ctx.translate(cx, d.cy);
    ctx.scale(d.s, d.s * STACK_SQUASH);
    drawSectionFigure(ctx, theme, model, d.row, 0, 0, R, { alpha: 1.25 * d.fade });
    ctx.restore();

    // bank letter off the left rim
    if (!clean) {
      ink(0.4 * d.fade);
      ctx.fillText(String.fromCharCode(65 + d.row.bank), cx - R * d.s - 22, d.cy + 4);
    }
  });

  drawChrome(ctx, model, theme, filename, W, H, FIG_ML, pad);
}

// ---------- svg recorder ----------
//
// a minimal Canvas2D-shaped recorder: the renderers draw into it unchanged
// and it emits SVG elements. covers exactly the API score.html uses.
// single-stroke vector output — plotter-friendly.

function SvgRecorder(W, H) {
  const elems = [];
  let m = [1, 0, 0, 1, 0, 0];          // current transform
  const stack = [];
  let d = "", empty = true;
  const st = { alpha: 1, lineWidth: 1, dash: [] };
  const self = {
    strokeStyle: "#000", fillStyle: "#000", font: "12px monospace", letterSpacing: "0px",
    set globalAlpha(v) { st.alpha = v; }, get globalAlpha() { return st.alpha; },
    set lineWidth(v) { st.lineWidth = v; }, get lineWidth() { return st.lineWidth; },
    setTransform(a, b, c, dd, e, f) { m = [a, b, c, dd, e, f]; },
    translate(x, y) { m = [m[0], m[1], m[2], m[3], m[4] + m[0] * x + m[2] * y, m[5] + m[1] * x + m[3] * y]; },
    scale(x, y) { m = [m[0] * x, m[1] * x, m[2] * y, m[3] * y, m[4], m[5]]; },
    save() { stack.push(m.slice()); },
    restore() { m = stack.pop() || m; },
    setLineDash(a) { st.dash = a || []; },
    beginPath() { d = ""; empty = true; },
    moveTo(x, y) { d += `M${fx(x)} ${fx(y)}`; empty = false; },
    lineTo(x, y) { d += (empty ? "M" : "L") + `${fx(x)} ${fx(y)}`; empty = false; },
    closePath() { d += "Z"; },
    arc(x, y, r, a0, a1) { arcPath(x, y, r, r, a0, a1); },
    ellipse(x, y, rx, ry, rot, a0, a1) { arcPath(x, y, rx, ry, a0, a1); },
    fillRect(x, y, w, h) {
      elems.push(`<rect x="${fx(x)}" y="${fx(y)}" width="${fx(w)}" height="${fx(h)}" fill="${self.fillStyle}" fill-opacity="${fx(st.alpha)}"${tf()}/>`);
    },
    stroke() {
      if (!d) return;
      elems.push(`<path d="${d}" fill="none" stroke="${self.strokeStyle}" stroke-width="${fx(st.lineWidth)}" stroke-opacity="${fx(st.alpha)}"${st.dash.length ? ` stroke-dasharray="${st.dash.join(" ")}"` : ""}${tf()}/>`);
    },
    fill() {
      if (!d) return;
      elems.push(`<path d="${d}" fill="${self.fillStyle}" fill-opacity="${fx(st.alpha)}" stroke="none"${tf()}/>`);
    },
    fillText(text, x, y) {
      const fm = /^(\d+(?:\.\d+)?)px (.+)$/.exec(self.font) || [0, 12, "monospace"];
      const esc = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      elems.push(`<text x="${fx(x)}" y="${fx(y)}" font-size="${fm[1]}" font-family="${fm[2]}" letter-spacing="${parseFloat(self.letterSpacing) || 0}" fill="${self.fillStyle}" fill-opacity="${fx(st.alpha)}"${tf()}>${esc}</text>`);
    },
    measureText(text) {
      const size = parseFloat(self.font) || 12;
      const ls = parseFloat(self.letterSpacing) || 0;
      return { width: String(text).length * (size * 0.62 + ls) };
    },
    svg() {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` + elems.join("\n") + `</svg>`;
    },
  };
  function fx(n) { return Math.round(n * 100) / 100; }
  function tf() { return ` transform="matrix(${m.map(fx).join(" ")})"`; }
  function arcPath(x, y, rx, ry, a0, a1) {
    const pt = (a) => `${fx(x + Math.cos(a) * rx)} ${fx(y + Math.sin(a) * ry)}`;
    const full = Math.abs(a1 - a0) >= Math.PI * 2 - 1e-6;
    if (full) {
      d += `M${pt(0)}A${fx(rx)} ${fx(ry)} 0 1 1 ${pt(Math.PI)}A${fx(rx)} ${fx(ry)} 0 1 1 ${pt(0)}`;
    } else {
      const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0;
      const sweep = a1 > a0 ? 1 : 0;
      d += (empty ? "M" : "L") + pt(a0) + `A${fx(rx)} ${fx(ry)} 0 ${large} ${sweep} ${pt(a1)}`;
    }
    empty = false;
  }
  return self;
}

// ---------- page wiring ----------

const drop = document.getElementById("drop");
const canvas = document.getElementById("score");
const fileInput = document.getElementById("file");
const status = document.getElementById("status");
const viewBtn = document.getElementById("view");

const VIEWS = { composition: renderComposition, stack: renderStack, figures: renderFigures };
let model = null, fname = "", inverted = false, view = "composition", format = "1:1", clean = false;

function draw(target, scale) {
  if (!model) return;
  const f = FORMATS[format];
  VIEWS[view](target || canvas, model, inverted ? PAPER : INK, scale || 2, fname, f.w, f.h, f.pad);
}

async function loadFile(file) {
  if (!file) return;
  let d;
  try {
    d = JSON.parse(await file.text());
  } catch (_) {
    status.textContent = "not a .seq file (couldn't parse json)";
    return;
  }
  const m = buildModel(d, file.name);
  if (!m) {
    status.textContent = "no active steps found in this file";
    return;
  }
  model = m;
  fname = file.name;
  await Promise.all(["42px zxx-bold", "13px zxx-sans", "14px zxx-noise"].map(f => document.fonts.load(f))).catch(() => {});
  drop.classList.add("loaded");
  draw();
  const n = (c, w) => c + " " + w + (c === 1 ? "" : "s");
  status.textContent = n(m.totalBars, "bar") + " · " + n(m.lanes.length, "voice") + " · " + n(m.rows.length, "section");
}

document.getElementById("prompt").addEventListener("click", () => fileInput.click());
document.getElementById("load").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("drag");
  loadFile(e.dataTransfer.files[0]);
});

function toggleView() {
  const names = Object.keys(VIEWS);
  view = names[(names.indexOf(view) + 1) % names.length];
  viewBtn.innerHTML = "view: " + view + ' <span class="key">[v]</span>';
  draw();
}
function toggleFormat() {
  const names = Object.keys(FORMATS);
  format = names[(names.indexOf(format) + 1) % names.length];
  document.getElementById("format").innerHTML = "format: " + format + ' <span class="key">[f]</span>';
  draw();
}
function toggleInvert() { if (model) { inverted = !inverted; draw(); } }
function toggleClean() {
  clean = !clean;
  document.getElementById("clean").innerHTML = "text: " + (clean ? "off" : "on") + ' <span class="key">[c]</span>';
  draw();
}
function download(href, ext) {
  const a = document.createElement("a");
  a.href = href;
  a.download = fname.replace(/\.seq$/i, "") + "-score" + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function savePng() {
  if (!model) return;
  const off = document.createElement("canvas");
  draw(off, 3);
  off.toBlob((blob) => download(URL.createObjectURL(blob), ".png"), "image/png");
}
function saveSvg() {
  if (!model) return;
  const f = FORMATS[format];
  const rec = SvgRecorder(f.w, f.h);
  const fake = { width: 0, height: 0, getContext: () => rec };
  VIEWS[view](fake, model, inverted ? PAPER : INK, 1, fname, f.w, f.h, f.pad);
  download(URL.createObjectURL(new Blob([rec.svg()], { type: "image/svg+xml" })), ".svg");
}
document.getElementById("view").addEventListener("click", toggleView);
document.getElementById("format").addEventListener("click", toggleFormat);
document.getElementById("invert").addEventListener("click", toggleInvert);
document.getElementById("clean").addEventListener("click", toggleClean);
document.getElementById("save").addEventListener("click", savePng);
document.getElementById("savesvg").addEventListener("click", saveSvg);
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "v") toggleView();
  if (e.key === "f") toggleFormat();
  if (e.key === "i") toggleInvert();
  if (e.key === "c") toggleClean();
  if (e.key === "s") savePng();
  if (e.key === "e") saveSvg();
});

})();
</script>
<script src="nav.js"></script>
<script src="grain.js"></script>
