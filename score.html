<style>
  @font-face { font-family: "zxx-sans";  src: url("fonts/zxx-sans.woff2")         format("woff2"); font-display: swap; }
  @font-face { font-family: "zxx-bold";  src: url("fonts/zxx-bold-regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "zxx-noise"; src: url("fonts/zxx-noise.woff2")        format("woff2"); font-display: swap; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; color: #ccc; }
  body {
    font: 12px/1.5 "SF Mono", "Menlo", "Consolas", monospace;
    /* clears the fixed site nav (nav.js maintains --ns-nav-h) */

  #drop {
    position: relative;
    min-height: 320px;

    transition: border-color 0.15s;

<body>

<h1>NEWSPEECH // SCORE</h1>
<p class="sub">graphic scores — drop a .seq file, get a graphic representation of the piece. nothing is uploaded; it renders here.</p>

<div id="drop">
  <div id="prompt">drop a .seq file<br>(or click to browse)</div>
  <canvas id="score"></canvas>
</div>
<div id="controls">
  <button id="load">load .seq</button>
  <button id="view">view: composition <span class="key">[v]</span></button>
  <button id="invert">invert <span class="key">[i]</span></button>
  <button id="save">save png <span class="key">[s]</span></button>
  <span id="status"></span>
</div>
<input type="file" id="file" accept=".seq,application/json" style="display:none">

<script>
(function () {
"use strict";

// ---------- model: .seq json -> rows (sections) + lanes (voices) ----------

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function stepsPerBar(rate) {
  // rate is a string like "1/16"; denominator = steps per bar
  const m = /^1\/(\d+)$/.exec(String(rate || ""));
  const n = m ? parseInt(m[1], 10) : 16;
  return (n >= 1 && n <= 64) ? n : 16;
}

function trackBars(t) {
  const len = t.length || (t.steps || []).length || 16;
  return Math.max(1, Math.ceil(len / stepsPerBar(t.rate)));
}

// muted tracks still count — they render as ghosts (authored material, reduced weight)
function hasHits(t) {
  return t && Array.isArray(t.steps) &&
    t.steps.slice(0, t.length || t.steps.length).some(s => s && s.on);
}

function stepPitches(s) {
  if (Array.isArray(s.notes) && s.notes.length) return s.notes;
  return [s.pitch || 0];
}

function rowMuted(row, laneId, laneIndex) {
  return row.mutes.some(m => m === laneId || m === laneIndex);
}

// build the row timeline: arrangement rows -> banks in order -> live tracks
function buildModel(d, filename) {
  const banks = (d.banks || []).map(b => b && b.tracks ? b.tracks : null);
  let rows = [];

  const arrRows = ((d.arrangement && d.arrangement.rows) || []).filter(r => r && r.bank != null && banks[r.bank]);
  if (arrRows.length) {
    rows = arrRows.map(r => ({ bank: r.bank, tracks: banks[r.bank], bars: Math.max(1, r.bars | 0), mutes: r.mutes || [] }));
  } else {
    banks.forEach((tracks, i) => {
      if (!tracks || !tracks.some(hasHits)) return;
      const bars = Math.max(...tracks.filter(hasHits).map(trackBars));
      rows.push({ bank: i, tracks, bars, mutes: [] });
    });
  }
  if (!rows.length && Array.isArray(d.tracks) && d.tracks.some(hasHits)) {
    const bars = Math.max(...d.tracks.filter(hasHits).map(trackBars));
    rows = [{ bank: 0, tracks: d.tracks, bars, mutes: [] }];
  }
  if (!rows.length) return null;

  // lanes = every track active in any used row, in t1..t16 order
  const laneMap = new Map();
  for (const row of rows) {
    for (let i = 0; i < row.tracks.length; i++) {
      const t = row.tracks[i];
      if (!hasHits(t)) continue;
      if (!laneMap.has(t.id)) {
        laneMap.set(t.id, { id: t.id, index: i, section: t.section || "drum", pmin: Infinity, pmax: -Infinity });
      }
      const lane = laneMap.get(t.id);
      if ((t.section || "drum") !== "drum") {
        for (const s of t.steps.slice(0, t.length)) {
          if (!s || !s.on) continue;
          for (const p of stepPitches(s)) {
            if (p < lane.pmin) lane.pmin = p;
            if (p > lane.pmax) lane.pmax = p;
          }
        }
      }
    }
  }
  const lanes = [...laneMap.values()].sort((a, b) => a.index - b.index);
  if (!lanes.length) return null;

  const totalBars = rows.reduce((n, r) => n + r.bars, 0);
  const root = d.rootNote != null ? NOTE_NAMES[((d.rootNote % 12) + 12) % 12] : null;
  return {
    name: (d.name || filename.replace(/\.seq$/i, "")).toUpperCase(),
    bpm: d.bpm || null,
    key: root ? root + " " + String(d.scale || "").toUpperCase() : null,
    rows, lanes, totalBars,
  };
}

// ---------- shared chrome (title block + footer) ----------

const INK  = { bg: "#050505", ink: "#e2e2e2" };
const PAPER = { bg: "#f2efe9", ink: "#181818" };

const LOGICAL_W = 1680;

function inker(ctx, theme) {
  return (a) => { ctx.globalAlpha = a; ctx.strokeStyle = theme.ink; ctx.fillStyle = theme.ink; };
}

function drawChrome(ctx, model, theme, filename, H, marginL) {
  const ink = inker(ctx, theme);
  try { ctx.letterSpacing = "8px"; } catch (_) {}
  ink(0.95);
  ctx.font = "42px zxx-bold, monospace";
  ctx.fillText(model.name, marginL, 74);
  try { ctx.letterSpacing = "3px"; } catch (_) {}
  ctx.font = "13px zxx-sans, monospace";
  ink(0.5);
  const seq = model.rows.map(r => String.fromCharCode(65 + r.bank) + r.bars);
  const meta = [
    model.bpm && model.bpm + " BPM",
    model.key,
    model.totalBars + " BARS",
    model.lanes.length + " VOICES",
    (seq.length > 14 ? seq.slice(0, 14).join(" ") + " …" : seq.join(" ")),
  ].filter(Boolean).join("   ·   ");
  ctx.fillText(meta, marginL, 104);
  try { ctx.letterSpacing = "0px"; } catch (_) {}

  ink(0.3);
  ctx.font = "12px zxx-sans, monospace";
  ctx.fillText(filename + "   ·   " + new Date().toISOString().slice(0, 10), marginL, H - 30);
  try { ctx.letterSpacing = "4px"; } catch (_) {}
  ink(0.5);
  ctx.font = "14px zxx-noise, monospace";
  const w = ctx.measureText("newspeech").width;
  ctx.fillText("newspeech", LOGICAL_W - 54 - w, H - 30);
  try { ctx.letterSpacing = "0px"; } catch (_) {}
  ctx.globalAlpha = 1;
}

// ---------- view 1: figures — each section becomes a geometric figure ----------
//
// every voice's pattern is placed around a circle (one ring per voice) and its
// hits are joined in time order: a four-on-the-floor kick is literally a square,
// offbeat hats a rotated square, syncopation an irregular polygon. melodic
// voices bend their ring with pitch, so a melody is a closed angular loop.
// nothing is random — the same .seq always draws the same figures.

const FIG_HEAD = 150, FIG_FOOT = 72, FIG_ML = 54, FIG_ROWGAP = 46;

// sections wrap into up to 4 rows (reading order = piece order). one global
// fit factor across all rows so a bank draws the same size wherever it
// appears — radius still tracks sqrt(bars).
function figureLayout(model) {
  const scoreW = LOGICAL_W - FIG_ML * 2;
  const gap = 34;
  const n = model.rows.length;
  const nRows = Math.min(4, n);
  const perRow = Math.floor(n / nRows), extra = n % nRows;

  // slice sections into rows, most-loaded rows first
  const groups = [];
  let idx = 0;
  for (let i = 0; i < nRows; i++) {
    const count = perRow + (i < extra ? 1 : 0);
    groups.push(model.rows.slice(idx, idx + count).map((row, j) => ({
      row, rowIndex: idx + j, R: 52 + 30 * Math.sqrt(row.bars),
    })));
    idx += count;
  }

  const width = (g) => g.reduce((s, c) => s + 2 * c.R, 0) + gap * (g.length - 1);
  const fit = Math.min(1, ...groups.map(g => scoreW / width(g)));

  let y = FIG_HEAD;
  const bands = groups.map(g => {
    const total = width(g) * fit;
    let x = FIG_ML + (scoreW - total) / 2;
    const clusters = g.map(c => {
      const r = c.R * fit;
      const cl = { cx: x + r, r, row: c.row, rowIndex: c.rowIndex };
      x += 2 * r + gap * fit;
      return cl;
    });
    const maxR = Math.max(...clusters.map(c => c.r));
    const cy = y + maxR;
    y += maxR * 2 + 30 + FIG_ROWGAP;   // 30 = label clearance under the figures
    return { clusters, cy, maxR };
  });

  return { bands, H: y - FIG_ROWGAP + FIG_FOOT };
}

// draw one section's figure at (cx, cy) radius r, optionally rotated/faded
function drawSectionFigure(ctx, theme, model, row, cx, cy, r, opts) {
  const rot = (opts && opts.rot) || 0;
  const alphaScale = (opts && opts.alpha) || 1;
  const ink = inker(ctx, theme);

  const voices = model.lanes
    .map(l => ({ lane: l, t: row.tracks[l.index] }))
    .filter(v => v.t && v.t.id === v.lane.id && hasHits(v.t));
  const K = voices.length;

  // pass 1: geometry for every voice
  const geo = voices.map((v, k) => {
    const t = v.t;
    const ghost = (t.mute || rowMuted(row, v.lane.id, v.lane.index)) ? 0.15 : 1;
    const ringR = r * (0.30 + 0.66 * (k + 1) / K);
    const band = (r * 0.66 / Math.max(K, 2)) * 0.9;
    const N = t.length || t.steps.length;
    const isDrum = (t.section || "drum") === "drum";

    const pts = [];
    const span = Math.max(1, v.lane.pmax - v.lane.pmin);
    for (let i = 0; i < N; i++) {
      const s = t.steps[i];
      if (!s || !s.on) continue;
      const ang = -Math.PI / 2 + rot + ((i + (s.microTiming || 0)) / N) * Math.PI * 2;
      const p = stepPitches(s)[0];
      const rr = isDrum ? ringR : ringR + (((p - v.lane.pmin) / span) - 0.5) * band;
      pts.push({
        x: cx + Math.cos(ang) * rr,
        y: cy + Math.sin(ang) * rr,
        ang, rr,
        tfrac: i / N,   // musical position in the loop (micro-timing excluded so coincidence matching stays exact)
        vel: Math.max(0, Math.min(1, s.velocity == null ? 1 : s.velocity)),
        prob: (s.probability == null ? 100 : s.probability) / 100,
        ratchet: Math.max(1, s.ratchet | 0),
        gate: s.gate || 1,
      });
    }
    return { pts, ghost, N, isDrum };
  }).filter(g => g.pts.length);

  // cross-voice chords (drawn first, under everything): hits landing at the
  // same position of their loops brace the rings together — where the groove
  // locks, the figure gets structure
  const coincident = new Map();
  geo.forEach((g, gi) => {
    for (const p of g.pts) {
      const key = Math.round(p.tfrac * 1920);
      if (!coincident.has(key)) coincident.set(key, []);
      coincident.get(key).push({ p, ghost: g.ghost, gi });
    }
  });
  ctx.lineWidth = 1;
  for (const group of coincident.values()) {
    if (group.length < 2 || !group.some(e => e.gi !== group[0].gi)) continue;
    group.sort((a, b) => a.p.rr - b.p.rr);
    for (let i = 1; i < group.length; i++) {
      const a = group[i - 1], b = group[i];
      ink(0.11 * (0.4 + 0.6 * Math.min(a.p.vel, b.p.vel)) * Math.min(a.ghost, b.ghost) * alphaScale);
      ctx.beginPath();
      ctx.moveTo(a.p.x, a.p.y);
      ctx.lineTo(b.p.x, b.p.y);
      ctx.stroke();
    }
  }

  // pass 2: per-voice sustain arcs, polygon, vertices
  for (const g of geo) {
    const { pts, ghost, N, isDrum } = g;

    // sustains: a melodic note held longer than a step sweeps its gate as an
    // arc at its pitch radius — long pads wrap the ring as horizon lines
    if (!isDrum) {
      for (const p of pts) {
        if (p.gate < 1.5) continue;
        const sweep = (Math.min(p.gate, N * 0.98) / N) * Math.PI * 2;
        ink(0.28 * p.prob * ghost * alphaScale);
        ctx.lineWidth = 0.8 + 1.2 * p.vel;
        ctx.beginPath();
        ctx.arc(cx, cy, p.rr, p.ang, p.ang + sweep);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    }

    // the polygon: hits joined in time order, closed (the pattern loops)
    ink(0.34 * ghost * alphaScale);
    ctx.lineWidth = 1;
    const dashed = pts.some(p => p.prob < 1);
    if (dashed) ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (pts.length > 2) ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    // vertices: weight = velocity; ratchets tick outward
    for (const p of pts) {
      ink((0.35 + 0.6 * p.vel) * (0.4 + 0.6 * p.prob) * ghost * alphaScale);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.2 + 2.6 * p.vel, 0, Math.PI * 2);
      ctx.fill();
      if (p.ratchet > 1) {
        ctx.lineWidth = 1;
        for (let q = 0; q < p.ratchet; q++) {
          const a2 = p.ang + (q - (p.ratchet - 1) / 2) * 0.05;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a2) * (p.rr + 4), cy + Math.sin(a2) * (p.rr + 4));
          ctx.lineTo(cx + Math.cos(a2) * (p.rr + 9), cy + Math.sin(a2) * (p.rr + 9));
          ctx.stroke();
        }
      }
    }
  }
}

function renderFigures(canvas, model, theme, scale, filename) {
  const { bands, H } = figureLayout(model);

  canvas.width = LOGICAL_W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, LOGICAL_W, H);
  const ink = inker(ctx, theme);

  for (const band of bands) {
    // faint axis through each row of figures — the timeline reduced to a rule
    ink(0.07);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(FIG_ML, band.cy);
    ctx.lineTo(LOGICAL_W - FIG_ML, band.cy);
    ctx.stroke();

    for (const { cx, r, row } of band.clusters) {
      // outer guide circle
      ink(0.09);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, band.cy, r, 0, Math.PI * 2);
      ctx.stroke();

      drawSectionFigure(ctx, theme, model, row, cx, band.cy, r);

      // bank letter + bars beneath the figure
      ink(0.45);
      ctx.font = "12px zxx-sans, monospace";
      const label = String.fromCharCode(65 + row.bank) + " · " + row.bars;
      const lw = ctx.measureText(label).width;
      ctx.fillText(label, cx - lw / 2, band.cy + band.maxR + 20);
    }
  }

  drawChrome(ctx, model, theme, filename, H, FIG_ML);
}

// ---------- view 2: composition — the whole piece as one figure ----------
//
// every section overlaid at a single center, each rotated to where it occurs
// in the piece (cumulative bars -> angle). the song wraps once around the
// circle: repeats of a bank re-enter as rotated echoes of the same shape,
// contrast sections cut across them. density is the arrangement.

function renderComposition(canvas, model, theme, scale, filename) {
  const H = 1240;
  const cx = LOGICAL_W / 2;
  const cy = FIG_HEAD + (H - FIG_HEAD - FIG_FOOT) / 2;
  const r = (H - FIG_HEAD - FIG_FOOT) / 2 - 36;

  canvas.width = LOGICAL_W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, LOGICAL_W, H);
  const ink = inker(ctx, theme);

  // one guide circle
  ink(0.09);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  let barsBefore = 0;
  ctx.font = "12px zxx-sans, monospace";
  model.rows.forEach((row) => {
    const rot = (barsBefore / model.totalBars) * Math.PI * 2;
    drawSectionFigure(ctx, theme, model, row, cx, cy, r, { rot, alpha: 0.8 });

    // entry mark: bank letter just outside the rim where this section begins
    const a = -Math.PI / 2 + rot;
    ink(0.4);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (r + 4), cy + Math.sin(a) * (r + 4));
    ctx.lineTo(cx + Math.cos(a) * (r + 14), cy + Math.sin(a) * (r + 14));
    ctx.stroke();
    const label = String.fromCharCode(65 + row.bank);
    const lw = ctx.measureText(label).width;
    ctx.fillText(label, cx + Math.cos(a) * (r + 26) - lw / 2, cy + Math.sin(a) * (r + 26) + 4);
    barsBefore += row.bars;
  });

  drawChrome(ctx, model, theme, filename, H, FIG_ML);
}

// ---------- page wiring ----------

const drop = document.getElementById("drop");
const canvas = document.getElementById("score");
const fileInput = document.getElementById("file");
const status = document.getElementById("status");
const viewBtn = document.getElementById("view");

const VIEWS = { composition: renderComposition, figures: renderFigures };
let model = null, fname = "", inverted = false, view = "composition";

function draw(target, scale) {
  if (!model) return;
  VIEWS[view](target || canvas, model, inverted ? PAPER : INK, scale || 2, fname);
}

async function loadFile(file) {
  if (!file) return;
  let d;
  try {
    d = JSON.parse(await file.text());
  } catch (_) {
    status.textContent = "not a .seq file (couldn't parse json)";
    return;
  }
  const m = buildModel(d, file.name);
  if (!m) {
    status.textContent = "no active steps found in this file";
    return;
  }
  model = m;
  fname = file.name;
  await Promise.all(["42px zxx-bold", "13px zxx-sans", "14px zxx-noise"].map(f => document.fonts.load(f))).catch(() => {});
  drop.classList.add("loaded");
  draw();
  const n = (c, w) => c + " " + w + (c === 1 ? "" : "s");
  status.textContent = n(m.totalBars, "bar") + " · " + n(m.lanes.length, "voice") + " · " + n(m.rows.length, "section");
}

document.getElementById("prompt").addEventListener("click", () => fileInput.click());
document.getElementById("load").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("drag");
  loadFile(e.dataTransfer.files[0]);
});

function toggleView() {
  const names = Object.keys(VIEWS);
  view = names[(names.indexOf(view) + 1) % names.length];
  viewBtn.innerHTML = "view: " + view + ' <span class="key">[v]</span>';
  draw();
}
function toggleInvert() { if (model) { inverted = !inverted; draw(); } }
function savePng() {
  if (!model) return;
  const off = document.createElement("canvas");
  draw(off, 3);
  off.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname.replace(/\.seq$/i, "") + "-score.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, "image/png");
}
document.getElementById("view").addEventListener("click", toggleView);
document.getElementById("invert").addEventListener("click", toggleInvert);
document.getElementById("save").addEventListener("click", savePng);
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "v") toggleView();
  if (e.key === "i") toggleInvert();
  if (e.key === "s") savePng();
});

})();
</script>
<script src="nav.js"></script>
<script src="grain.js"></script>
</body>
</html>
