<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<!-- Unlisted until the first real product is in shop.json — then drop the
     noindex and add the nav entry. -->
<meta name="robots" content="noindex, nofollow">
<title>NEWSPEECH // shop</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="newspeech — shirts and physical music.">
<meta property="og:title" content="NEWSPEECH // shop">
<meta property="og:description" content="newspeech — shirts and physical music.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.newspeechsound.com/shop.html">
<meta property="og:site_name" content="NEWSPEECH">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="https://www.newspeechsound.com/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="NEWSPEECH">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NEWSPEECH // shop">
<meta name="twitter:description" content="newspeech — shirts and physical music.">
<meta name="twitter:image" content="https://www.newspeechsound.com/og-image.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; color: #ccc; }
  body {
    font: 12px/1.5 "SF Mono", "Menlo", "Consolas", monospace;
    /* clears the fixed site nav (nav.js maintains --ns-nav-h) */
    padding: calc(24px + var(--ns-nav-h, 0px)) 20px 60px;
    max-width: 1060px;
    margin: 0 auto;
  }
  h1 { font-size: 14px; font-weight: 400; letter-spacing: 0.2em; color: #eee; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; }

  button {
    background: transparent; border: 1px solid #444; color: #ccc; font: inherit;
    padding: 6px 14px; cursor: pointer; letter-spacing: 0.1em; border-radius: 0;
  }
  button:hover { border-color: #999; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }
  button.on { background: #ddd; color: #050505; border-color: #ddd; }

  .seg { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .seg button { padding: 3px 8px; font-size: 10px; border-color: #2a2a2a; color: #777; letter-spacing: 0.12em; }
  .seg button.on { background: #ddd; color: #050505; border-color: #ddd; }
  .seg button.out { text-decoration: line-through; }
  .seg .seglabel { color: #666; padding: 0 6px 0 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; min-width: 64px; }
  .seg .hint { color: #555; padding-left: 6px; }

  #shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .item { border: 1px solid #1c1c1c; display: flex; flex-direction: column; min-width: 0; }
  .pic { aspect-ratio: 1; background: #0a0a0a; border-bottom: 1px solid #1c1c1c; position: relative; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1); }
  /* no photo yet: the name, big, in the noise cut */
  .pic .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: "zxx-noise", ui-monospace, monospace; font-size: 34px; line-height: 1.05; text-align: center;
    color: rgba(255,255,255,.16); text-transform: uppercase; word-break: break-word;
  }
  .pic .tag {
    position: absolute; top: 10px; left: 10px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #050505; background: #ddd; padding: 1px 6px;
  }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .head h2 { font-size: 11px; font-weight: 400; letter-spacing: 0.25em; color: #eee; margin: 0; text-transform: uppercase; }
  .head .price { color: #999; font-variant-numeric: tabular-nums; }
  .blurb { color: #777; margin: 0; }
  .buyrow { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .buyrow .msg { color: #666; }
  .buyrow .msg.err { color: #999; }

  /* empty shelf + the post-checkout note share the window chrome */
  .note { border: 1px solid #1c1c1c; padding: 28px 24px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .note .big { font-family: "zxx-sans", ui-monospace, monospace; font-size: 20px; letter-spacing: 0.06em; color: #eee; text-transform: lowercase; }
  .note p { margin: 0; color: #777; max-width: 60ch; }
  [hidden] { display: none !important; }

  @media (max-width: 720px) { #shelf { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="nav.js"></script>
<script src="gate.js"></script>
<script src="grain.js"></script>

<h1>// SHOP</h1>
<p class="sub">shirts + physical music — shipped by hand</p>

<div class="note" id="thanks" hidden>
  <span class="big">signal received</span>
  <p>your order's in. a receipt is on its way from stripe, and it ships as soon as it's packed.</p>
</div>

<div class="note" id="empty" hidden>
  <span class="big">nothing on the shelf yet</span>
  <p id="empty-copy">shirts and tapes are on the way. the list hears first.</p>
  <button id="empty-join">tell me when</button>
</div>

<div id="shelf"></div>

<script>
// ---- the shop: renders shop.json; buy → POST /api/checkout → Stripe's
// hosted checkout → back here with ?order=<session id>. prices live in
// shop.json and the function prices from it — nothing here is trusted.
// drafts render off the production host (previews, local) or with ?drafts.
(() => {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const PROD = /^(www\.)?newspeechsound\.com$/.test(location.hostname);
  const SHOW_DRAFTS = !PROD || q.has("drafts");

  const money = (c) => "$" + (c % 100 ? (c / 100).toFixed(2) : String(c / 100));
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  if (q.has("order")) {
    $("thanks").hidden = false;
    history.replaceState(null, "", location.pathname + (q.has("drafts") ? "?drafts" : ""));
  }

  function soldOut(p, opt) {
    if (p.soldOut === true) return true;
    return Array.isArray(p.soldOut) && opt ? p.soldOut.includes(opt) : false;
  }

  function card(p, shipping) {
    const item = el("article", "item");
    const pic = el("div", "pic");
    if (p.image) { const img = el("img"); img.src = p.image; img.alt = p.name; img.loading = "lazy"; pic.appendChild(img); }
    else pic.appendChild(el("div", "ph", p.name));
    if (p.draft) pic.appendChild(el("span", "tag", "draft"));
    else if (soldOut(p)) pic.appendChild(el("span", "tag", "sold out"));
    item.appendChild(pic);

    const body = el("div", "body");
    const head = el("div", "head");
    head.append(el("h2", null, p.name), el("span", "price", money(p.price)));
    body.appendChild(head);
    if (p.blurb) body.appendChild(el("p", "blurb", p.blurb));

    const opts = p.options || [];
    let option = "";
    let region = "us";
    const buy = el("button", "buy", "BUY");
    const msg = el("span", "msg");
    const refresh = () => {
      buy.disabled = soldOut(p) || (opts.length && !option) || soldOut(p, option);
      buy.textContent = soldOut(p) || soldOut(p, option) ? "SOLD OUT" : "BUY";
    };

    if (opts.length) {
      const seg = el("div", "seg");
      seg.appendChild(el("span", "seglabel", p.kind === "shirt" ? "size" : "option"));
      for (const o of opts) {
        const b = el("button", soldOut(p, o) ? "out" : null, o);
        b.addEventListener("click", () => {
          option = o;
          seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
          msg.textContent = "";
          refresh();
        });
        seg.appendChild(b);
      }
      body.appendChild(seg);
    }

    const shipSeg = el("div", "seg");
    shipSeg.appendChild(el("span", "seglabel", "ship to"));
    const hint = el("span", "hint");
    for (const [key, s] of Object.entries(shipping)) {
      const b = el("button", key === region ? "on" : null, s.label);
      b.addEventListener("click", () => {
        region = key;
        shipSeg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        hint.textContent = "+" + money(s.amount) + " shipping";
      });
      shipSeg.appendChild(b);
    }
    hint.textContent = "+" + money(shipping[region].amount) + " shipping";
    shipSeg.appendChild(hint);
    body.appendChild(shipSeg);

    buy.addEventListener("click", async () => {
      buy.disabled = true;
      msg.className = "msg";
      msg.textContent = "opening checkout…";
      try {
        const res = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ product: p.id, option, region }),
        });
        const r = await res.json().catch(() => ({}));
        if (res.ok && r.url) { location.href = r.url; return; }
        throw new Error(r.error || String(res.status));
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = e.message === "sold out" ? "just sold out — sorry"
          : e.message === "not configured" ? "checkout isn't wired up yet"
          : "transmission failed — try again";
        refresh();
      }
    });

    const row = el("div", "buyrow");
    row.append(buy, msg);
    body.appendChild(row);
    item.appendChild(body);
    refresh();
    return item;
  }

  function empty() {
    $("empty").hidden = false;
    const join = $("empty-join");
    if (window.NewspeechGate && NewspeechGate.known()) {
      $("empty-copy").textContent = "shirts and tapes are on the way. you're on the list — you'll hear first.";
      join.hidden = true;
      return;
    }
    join.addEventListener("click", () => NewspeechGate.show({
      source: "shop",
      label: "shirts + physical music are on the way — leave an email and you'll hear the day they're up",
    }));
  }

  fetch("shop.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((cat) => {
      const list = cat.products.filter((p) => SHOW_DRAFTS || !p.draft);
      if (!list.length) return empty();
      const shelf = $("shelf");
      for (const p of list) shelf.appendChild(card(p, cat.shipping));
    })
    .catch(() => empty());
})();
</script>
</body>
</html>
