  to = "/plugins.html"
  status = 301

# the EP was renamed night school → dead ocean (2026-10-03)
[[redirects]]
  from = "/night-school.html"
  to = "/dead-ocean.html"
  status = 301

# live.html (the strudel repl) retired 2026-09-25 — old links land home
