[build]
  command = "bash build.sh"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# /api/subscribe — Resend contact capture (netlify/functions/subscribe.mjs);
# needs RESEND_API_KEY in the site env
# /api/listen + /api/stream — private pre-release streams (netlify/lib/listen.mjs);
# need LISTEN_SECRET + R2_* too (netlify/lib/r2.mjs), and the audio in the R2
# bucket via tools/release-audio
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /start — the link-in-bio hub (instagram bio points here)
[[redirects]]
  from = "/start"
  to = "/start.html"
  status = 200

# dl:vibe begin — managed by vst/release.sh
[[redirects]]
  from = "/dl/vibe"
  to = "https://github.com/elkjar/newspeech/releases/download/vibe-v1.0.0/Vibe-1.0.0.zip"
  status = 302
# dl:vibe end

# dl:vibe-win begin — Windows VST3 (unsigned, CI-built; asset on the v1.0.0 release)
[[redirects]]
  from = "/dl/vibe-win"
  to = "https://github.com/elkjar/newspeech/releases/download/vibe-v1.0.0/Vibe-1.0.0-win.zip"
