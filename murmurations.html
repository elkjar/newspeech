<script src="core.js"></script>
<script src="murmurations-flock.js"></script>
<script>
const { installInputs, tickInputs, installPanel, audioActive, audioLevel, drawSoftDot, poisson } = Newspeech;
installInputs();

// ---- params (saved to localStorage) ----
const STORE = "newspeech.murmurations";
const params = {
  k: 7,
  contagion: 1,
  restless: 5,
  reaction: 70,
  singers: 48,
  voices: 0.8,
  bed: 0.5,
  falcon: 0.12,
  spread: 2,
  reverb: 0.6,
  reverbSize: 0.5,
  depth: 17,
};
// flock shape controls: page key = flock param, except birds / dot / view
// speed is shown in m/s but plays as slow motion: the flock always flies at
// 10 m/s and runs at speed / 10 of real time
// tuned by eye by Chris, 2026-11-01
const FLOCK_DEFAULTS = {
  birds: 4200,
  dot: 1.1,
  view: 40,
  speed: 4,
  align: 2.6,
  local: 10,
  pull: 0.1,
  cohesion: 0.85,
  radius: 0.75,
  sep: 30,
  sepRadius: 1,
  noise: 0.6,
  steer: 0.45,
  roam: 0.45,
  edge: 6,
  bank: 0.6,
  turnAngle: 1.5,
  turnTime: 0.45,
};
Object.assign(params, FLOCK_DEFAULTS);
try { Object.assign(params, JSON.parse(localStorage.getItem(STORE + ".params3d") || "{}")); } catch (e) {}
function saveParams() { try { localStorage.setItem(STORE + ".params3d", JSON.stringify(params)); } catch (e) {} }

// ---- voices: sample pack + octave per slot (saved) ----
const SINGERS = 4;
const VOICE_SLOTS = ["1", "2", "3", "4", "pad"];
const voiceCfg = {
  1: ["instruments/plaits-soft-rev", 0],
  2: ["instruments/rhodes_mk1", 1],
  3: ["instruments/soft_piano", 0],
  4: ["instruments/grand-piano-ss", 0],
  pad: ["pads/monolith-databent", -1],
};
try { Object.assign(voiceCfg, JSON.parse(localStorage.getItem(STORE + ".voices2") || "{}")); } catch (e) {}
function saveVoices() { try { localStorage.setItem(STORE + ".voices2", JSON.stringify(voiceCfg)); } catch (e) {} }

// per-pack pitch correction, cents, from measuring the zones these octaves use
const TUNE = {
  "instruments/grand-piano-ss": -13,   // measured +9..+20
  "instruments/plaits-soft-rev": 5,    // measured +1..-12
};

const urlBirds = +new URLSearchParams(location.search).get("n");
if (urlBirds) params.birds = urlBirds;
const flock = MurmFlock.createFlock({ n: params.birds });

// fly 30 s of flock time at full speed before anything is shown, so the
// flock has its shape instead of starting as a ball
function warmFlock() {
  const ts = flock.params.timeScale;
  flock.params.timeScale = 1;
  for (let i = 0, t = -30; i < 900; i++, t += 1 / 30) flock.step(1 / 30, t);
  flock.params.timeScale = ts;
  flock.events.length = 0;
}

function syncFlockParams() {
  flock.params.k = params.k;
  flock.params.contagion = params.contagion;
  flock.params.reaction = params.reaction / 1000;
  flock.params.halfD = params.depth;
  for (const k in FLOCK_DEFAULTS) if (k in flock.params && k !== "speed") flock.params[k] = params[k];
  flock.params.timeScale = params.speed / 10;
  if (flock.n !== params.birds) flock.setCount(params.birds);
}
syncFlockParams();
warmFlock();

// ---- harmony: D minor, one seventh chord per wave ----
const ROOT = 50; // D3
const SCALE = [0, 2, 3, 5, 7, 8, 10];
// i, VI, III, VII, iv, v (scale degrees, 0 = D)
const CHORDS = [[0, 2, 4, 6], [5, 0, 2, 4], [2, 4, 6, 1], [6, 1, 3, 5], [3, 5, 0, 2], [4, 6, 1, 3]];
let chordIdx = 0;
function degSemis(d) { return SCALE[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7); }

// the bed moves through PROGRESSION on its own clock (CHORD_SECS per chord);
// waves play in the current chord, strikes jump to the next one
const PROGRESSION = [0, 1, 2, 3];   // i, VI, III, VII
const CHORD_SECS = 4;   // monolith-databent notes sound ~4 s (8.2 s files, near-silent after 5 s)
let progIdx = 0;
function nextChord() {
  progIdx = (progIdx + 1) % PROGRESSION.length;
  chordIdx = PROGRESSION[progIdx];
  bedChord(CHORDS[chordIdx]);
}
flock.onWave = (w) => {
  if (w.kind === "strike") nextChord();
  w.chord = CHORDS[chordIdx];
};

// each bird's octave: triangular draw in [-1, 1], scaled by `spread`
const birdOct = Float32Array.from({ length: MurmFlock.NMAX }, () => Math.random() + Math.random() - 1);

// singer i: slot = i % SINGERS, chord tone = floor(i / SINGERS) % 4,
// octave = slot octave + its own offset, kept inside the pack's sampled range
function singerNote(i, chord) {
  const [pack, oct] = voiceCfg[(i % SINGERS) + 1];
  let note = ROOT + 12 * (oct + Math.round(birdOct[i] * params.spread)) + degSemis(chord[Math.floor(i / SINGERS) % chord.length]);
  const kit = kits.get(pack);
  if (kit) {
    const lo = kit.roots[0].midi - kit.shift, hi = kit.roots[kit.roots.length - 1].midi - kit.shift;
    while (note > hi + 2) note -= 12;
    while (note < lo - 2) note += 12;
  }
  return note;
}

// ---- canvas + camera ----
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let cw = 0, ch = 0, dpr = 1, unit = 1, scale = 1;
function resize() {
  dpr = Math.max(1, window.devicePixelRatio || 1);
  cw = Math.floor(window.innerWidth * dpr);
  ch = Math.floor(window.innerHeight * dpr);
  canvas.width = cw; canvas.height = ch;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  // drawing sizes scale with the screen, so a projector gets thick marks
  unit = Math.min(cw, ch) / 1000;
  // the flock's space matches the screen: short side = `view` m
  const a = cw / ch, h = params.view / 2;
  flock.params.halfW = a >= 1 ? h * a : h;
  flock.params.halfH = a >= 1 ? h : h / a;
  scale = Math.min(cw / (2 * flock.params.halfW), ch / (2 * flock.params.halfH));
}
window.addEventListener("resize", resize);
resize();

// side view in perspective: the box's middle plane (z = 0) fills the
// screen; the camera sits 3 half-heights in front of it. proj[2] = scale
// factor at the bird's depth (> 1 nearer the viewer)
const proj = [0, 0, 1];
function project(x, y, z) {
  const cam = 3 * flock.params.halfH;
  const f = cam / Math.max(0.2 * cam, cam - z);
  proj[0] = cw * 0.5 + x * scale * f;
  proj[1] = ch * 0.5 - y * scale * f;
  proj[2] = f;
}
// screen quadrant → speaker: top = front (by the screen).
// 0 FL top-left, 1 FR top-right, 2 RL bottom-left, 3 RR bottom-right
function quadrant(sx, sy) { return (sy < ch * 0.5 ? 0 : 2) + (sx > cw * 0.5 ? 1 : 0); }

// ---- strikes (mic / click) ----
// birds within `radius` of the point turn away at once; the rest follow by contagion
function strikeAt(x, y, z, radius) { flock.strike(simT, x, y, z, radius); }
function peripheralBird() {
  const s = flock.stats;
  let best = 0, far = -1;
  for (let n = 0; n < 8; n++) {
    const i = (Math.random() * flock.n) | 0;
    const d = (flock.px[i] - s.cx) ** 2 + (flock.py[i] - s.cy) ** 2 + (flock.pz[i] - s.cz) ** 2;
    if (d > far) { far = d; best = i; }
  }
  return best;
}

// ---- mic → strike ----
// triggers when mic level jumps above its 6 s average by `falcon`. the
// threshold also rises with output level (speakers reach the mic) and with
// any recent rise in our own output (a new pad chord swelling in reaches
// the mic too), so the room can't loop into itself. 4 s cooldown.
let micBase = 0, falconCool = 0, outSlow = 0;
const strikeTimes = [];
function tickMic(dt) {
  falconCool -= dt;
  outSlow += (outLevel - outSlow) * (1 - Math.exp(-dt / 1.5));
  if (!audioActive()) return;
  const lvl = audioLevel();
  micBase += (lvl - micBase) * (1 - Math.exp(-dt / 6));
  const outRise = Math.max(0, outLevel - outSlow);
  const excess = lvl - micBase - params.falcon - outLevel * 0.6 - outRise * 3;
  if (excess > 0 && falconCool <= 0) {
    const i = peripheralBird();
    strikeAt(flock.px[i], flock.py[i], flock.pz[i], 3 + 30 * Math.min(0.4, excess));
    falconCool = 4;
    strikeTimes.push(performance.now());
  }
}

// ---- sample library (sequencer/samples, same packs as samples.html) ----
// build.sh publishes sequencer/public/samples as sequencer/samples; a local
// server at the repo root serves the source tree
const SAMPLE_BASE = /^(localhost|127\.|192\.168\.|10\.|$)/.test(location.hostname)
  ? "sequencer/public/samples" : "sequencer/samples";
const kitLoads = new Map(), kits = new Map(), buffers = new Map();
function loadKit(pack) {
  if (!kitLoads.has(pack)) {
    kitLoads.set(pack, fetch(`${SAMPLE_BASE}/${pack}/kit.seqkit`)
      .then(r => r.json())
      .then(k => {
        const v = Object.values(k.voices)[0];
        const kit = {
          gain: v.gain ?? 0.7,
          shift: 12 * (v.octaveOffset || 0),
          roots: v.roots.slice().sort((a, b) => a.midi - b.midi),
        };
        kits.set(pack, kit);
        return kit;
      })
      .catch(e => { console.warn("kit", pack, e); kitLoads.delete(pack); }));
  }
  return kitLoads.get(pack);
}
function nearestRoot(kit, midi) {
  let best = kit.roots[0];
  for (const r of kit.roots) if (Math.abs(r.midi - midi) < Math.abs(best.midi - midi)) best = r;
  return best;
}
function loadBuffer(url) {
  if (!buffers.has(url)) {
    buffers.set(url, fetch(url)
      .then(r => r.arrayBuffer())
      .then(b => ac.decodeAudioData(b))
      .then(buf => { buffers.set(url, buf); return buf; })
      .catch(e => { console.warn("sample", url, e); buffers.delete(url); }));
  }
  return buffers.get(url);
}
// load only the zones the given notes will use
// notes = null loads every zone
async function preload(pack, notes) {
  const kit = await loadKit(pack);
  if (!kit) return;
  const zones = notes ? new Set(notes.map(m => nearestRoot(kit, m + kit.shift))) : kit.roots;
  await Promise.all([...zones].flatMap(z => z.files.map(f => loadBuffer(`${SAMPLE_BASE}/${pack}/${f}`))));
}
function slotNotes(slot) {
  const [, oct] = voiceCfg[slot];
  const base = ROOT + 12 * oct;
  const out = new Set();
  for (const c of CHORDS) {
    for (const d of c) { out.add(base + degSemis(d)); out.add(base + degSemis(d + 7)); }
  }
  return [...out];
}
// singers can land in any octave, so they load every zone
function preloadSlot(slot) { return preload(voiceCfg[slot][0], slot === "pad" ? slotNotes(slot) : null); }
function preloadAll() { return Promise.all(VOICE_SLOTS.map(preloadSlot)); }

// one sample note: pitched from the nearest zone, gain envelope, returns
// the gain node (caller routes it) or null if the zone isn't loaded yet
function sampleNote(pack, midi, t, vel, opts) {
  const kit = kits.get(pack);
  if (!kit) return null;
  const note = midi + kit.shift;
  const zone = nearestRoot(kit, note);
  const buf = buffers.get(`${SAMPLE_BASE}/${pack}/${zone.files[(Math.random() * zone.files.length) | 0]}`);
  if (!(buf instanceof AudioBuffer)) return null;
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = Math.pow(2, (note - zone.midi + (TUNE[pack] || 0) / 100) / 12);
  const len = buf.duration / src.playbackRate.value;
  const dur = Math.min(len, opts.maxDur || len);
  const atk = opts.attack || 0.003;
  const rel = Math.min(opts.release || 0.3, dur - atk);
  const peak = vel * kit.gain;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + atk);
  g.gain.setValueAtTime(peak, t + dur - rel);
  g.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(g);
  src.start(t);
  src.stop(t + dur + 0.02);
  return { g, src, dur, t };
}
function releaseNote(n, t, secs) {
  if (t >= n.t + n.dur) return;
  const p = n.g.gain;
  if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
  else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
  p.linearRampToValueAtTime(0, t + secs);
  try { n.src.stop(t + secs + 0.02); } catch (e) {}
}

// ---- audio ----
let ac = null, buses = [], reverbs = [], master = null, meter = null, meterBuf = null;
let outLevel = 0, activeVoices = 0, hushed = false, quad = false;
let busMeters = [];
const busLevel = [0, 0, 0, 0], busBuf = new Float32Array(512);
const bed = { out: [], notes: [], next: 0 };

let plate = null, plateRet = [];
// reverb slider 0..1 → return gain. 0.55 × 0.6 ≈ the old reverb's level
// (the plate measured 3× louder than it on the same noise burst)
function reverbReturn() { return 0.55 * params.reverb; }

async function startAudio(sinkId) {
  if (ac) { try { await ac.close(); } catch (e) {} }
  const opts = { latencyHint: "balanced" };
  if (sinkId) opts.sinkId = sinkId;
  try { ac = new AudioContext(opts); } catch (e) { ac = new AudioContext({ latencyHint: "balanced" }); }
  const dest = ac.destination;
  quad = dest.maxChannelCount >= 4;
  dest.channelCount = quad ? 4 : 2;
  dest.channelCountMode = "explicit";
  dest.channelInterpretation = "discrete";

  master = ac.createGain();
  master.gain.value = hushed ? 0.18 : 1;
  const merger = ac.createChannelMerger(quad ? 4 : 2);
  merger.connect(master).connect(dest);
  master.channelCount = quad ? 4 : 2;
  master.channelCountMode = "explicit";
  master.channelInterpretation = "discrete";

  meter = ac.createAnalyser();
  meter.fftSize = 1024;
  meterBuf = new Float32Array(meter.fftSize);

  buses = []; busMeters = [];
  for (let c = 0; c < 4; c++) {
    const bus = ac.createGain();
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -12; lim.knee.value = 6; lim.ratio.value = 12;
    lim.attack.value = 0.003; lim.release.value = 0.25;
    bus.connect(lim);
    // stereo: FL+RL → L, FR+RR → R
    lim.connect(merger, 0, quad ? c : c % 2);
    lim.connect(meter);
    const m = ac.createAnalyser(); m.fftSize = 512;
    lim.connect(m);
    busMeters.push(m);
    buses.push(bus);
  }

  // the sequencer's plate (murmurations-plate.js), one per speaker: send c
  // → plate c → speaker c, so a voice's tail stays where it fired
  await ac.audioWorklet.addModule("murmurations-plate.js");
  plate = new AudioWorkletNode(ac, "murm-plate", {
    numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [4],
    channelCount: 4, channelCountMode: "explicit", channelInterpretation: "discrete",
  });
  plate.port.postMessage({ size: params.reverbSize });
  const sendMerge = ac.createChannelMerger(4), retSplit = ac.createChannelSplitter(4);
  sendMerge.connect(plate).connect(retSplit);
  reverbs = buses.map((bus, c) => {
    const send = ac.createGain();
    send.connect(sendMerge, 0, c);
    return send;
  });
  plateRet = buses.map((bus, c) => {
    const ret = ac.createGain(); ret.gain.value = reverbReturn();
    retSplit.connect(ret, c).connect(bus);
    return ret;
  });

  startBed();
  return ac.resume();
}

function startBed() {
  // one gain per speaker (bed level) → bus + that speaker's reverb
  bed.out = buses.map((bus, c) => {
    const g = ac.createGain();
    g.gain.value = params.bed;
    g.connect(bus);
    const r = ac.createGain(); r.gain.value = 0.5;
    g.connect(r).connect(reverbs[c]);
    return g;
  });
  bed.notes = [];
}

// pad chord on each wave: swells in, rings out, no restrike. equal in all
// four speakers (0.5 each = equal power), so it sits in the middle of the room.
function bedChord(chord) {
  if (!ac || !bed.out.length) return;
  const t = ac.currentTime + 0.02;
  for (const n of bed.notes) releaseNote(n, t, 3);
  bed.notes = [];
  bed.next = t + CHORD_SECS;
  const [pad, padOct] = voiceCfg.pad;
  chord.forEach((d) => {
    const n = sampleNote(pad, ROOT + 12 * padOct + degSemis(d), t, 0.45, { attack: 1.2, release: 3 });
    if (!n) return;
    const p = ac.createGain(); p.gain.value = 0.5;
    n.g.connect(p);
    for (const out of bed.out) p.connect(out);
    bed.notes.push(n);
  });
}

function tickBed(dt) {
  if (!ac || !bed.out.length) return;
  const t = ac.currentTime;
  if (bed.next && t >= bed.next) nextChord();
  for (const g of bed.out) g.gain.setTargetAtTime(params.bed, t, 0.3);

  meter.getFloatTimeDomainData(meterBuf);
  let sum = 0;
  for (let i = 0; i < meterBuf.length; i++) sum += meterBuf[i] * meterBuf[i];
  outLevel += (Math.sqrt(sum / meterBuf.length) - outLevel) * 0.3;

  // per-speaker peak, fast up, slow down
  busMeters.forEach((m, c) => {
    m.getFloatTimeDomainData(busBuf);
    let pk = 0;
    for (let i = 0; i < busBuf.length; i++) pk = Math.max(pk, Math.abs(busBuf[i]));
    busLevel[c] = pk > busLevel[c] ? pk : busLevel[c] * Math.exp(-dt / 0.35);
  });
}

// a singer plays from one speaker only: the quadrant its bird is in
function playSinger(i, midi, vel, c, t) {
  if (!ac || activeVoices > 96) return;
  const n = sampleNote(voiceCfg[(i % SINGERS) + 1][0], midi, t, vel, { maxDur: 3.5, release: 0.6 });
  if (!n) return;
  n.g.connect(buses[c]);
  const s = ac.createGain(); s.gain.value = 0.35;
  n.g.connect(s).connect(reverbs[c]);
  activeVoices++;
  setTimeout(() => { activeVoices--; n.g.disconnect(); }, (n.dur + 0.2) * 1000 + (t - ac.currentTime) * 1000);
}

// three notes from voice 2 on one bus
function speakerTest(c) {
  if (!ac) return;
  const t = ac.currentTime + 0.02;
  for (let r = 0; r < 3; r++) {
    const n = sampleNote(voiceCfg[2][0], ROOT + 12 * voiceCfg[2][1] + degSemis(r * 2), t + r * 0.25, 0.9, { maxDur: 1, release: 0.3 });
    if (n) n.g.connect(buses[c]);
  }
}

// ---- events → voices + flashes ----
const flashes = [];
function drainEvents() {
  for (const e of flock.events) {
    if (e.i >= params.singers) continue;
    flashes.push({ i: e.i, t0: e.t });
    if (!ac || params.voices <= 0) continue;
    const w = e.wave;
    const vel = params.voices * (w.kind === "strike" ? 0.9 : 0.45 + 0.3 * Math.random());
    const lag = Math.max(0, e.t - simT);
    project(flock.px[e.i], flock.py[e.i], flock.pz[e.i]);
    playSinger(e.i, singerNote(e.i, w.chord || CHORDS[chordIdx]), vel, quadrant(proj[0], proj[1]), ac.currentTime + 0.02 + lag);
  }
  flock.events.length = 0;
}

// ---- render ----
const meterCanvas = document.getElementById("meters");
const mctx = meterCanvas.getContext("2d");
function drawMeters() {
  const w = Math.round(meterCanvas.clientWidth * dpr), h = Math.round(meterCanvas.clientHeight * dpr);
  if (meterCanvas.width !== w || meterCanvas.height !== h) { meterCanvas.width = w; meterCanvas.height = h; }
  mctx.clearRect(0, 0, w, h);
  // four bars, one per speaker, -60..0 dBFS
  const bh = Math.max(1, Math.round(h / 7)), gap = (h - 4 * bh) / 3;
  for (let c = 0; c < 4; c++) {
    const y = Math.round(c * (bh + gap));
    const db = 20 * Math.log10(Math.max(1e-6, busLevel[c]));
    const f = Math.max(0, Math.min(1, (db + 60) / 60));
    mctx.fillStyle = "rgba(255,255,255,0.15)";
    mctx.fillRect(0, y, w, bh);
    mctx.fillStyle = "rgba(255,255,255,0.9)";
    mctx.fillRect(0, y, Math.round(w * f), bh);
  }
}

function draw(dt) {
  // trails fade to transparent
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = `rgba(0,0,0,${Math.min(1, dt * 22).toFixed(3)})`;
  ctx.fillRect(0, 0, cw, ch);
  ctx.restore();

  const n = flock.n, px = flock.px, py = flock.py, pz = flock.pz;
  const d = params.dot * unit;
  // three depth layers: far birds dimmer, near brighter; size by perspective.
  // birds that joined a wave in the last 0.5 s are lit: the wave front
  const third = params.depth / 3;
  const lit = (i) => simT - flock.joinedAt(i) < 0.5;
  [[-Infinity, -third, 0.35], [-third, third, 0.6], [third, Infinity, 0.9]].forEach(([lo, hi, a]) => {
    ctx.fillStyle = `rgba(225,225,225,${a})`;
    for (let i = 0; i < n; i++) {
      if (lit(i) || pz[i] < lo || pz[i] >= hi) continue;
      project(px[i], py[i], pz[i]);
      const s = Math.max(1, Math.round(d * proj[2]));
      ctx.fillRect(proj[0] - s / 2, proj[1] - s / 2, s, s);
    }
  });
  ctx.fillStyle = "#fff";
  for (let i = 0; i < n; i++) {
    if (!lit(i)) continue;
    project(px[i], py[i], pz[i]);
    const s = Math.max(2, Math.round(1.7 * d * proj[2]));
    ctx.fillRect(proj[0] - s / 2, proj[1] - s / 2, s, s);
  }

  for (let f = flashes.length - 1; f >= 0; f--) {
    const fl = flashes[f], age = simT - fl.t0;
    if (age > 0.6 || fl.i >= n) { flashes.splice(f, 1); continue; }
    if (age < 0) continue;
    project(px[fl.i], py[fl.i], pz[fl.i]);
    drawSoftDot(ctx, proj[0], proj[1], 50 * unit * proj[2], 0.75 * (1 - age / 0.6));
  }
  drawMeters();
}

// ---- loop ----
let simT = 0, acc = 0, lastT = performance.now();
const STEP = 1 / 60;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  tickInputs(dt);
  acc += dt;
  while (acc >= STEP) {
    flock.step(STEP, simT);
    simT += STEP;
    acc -= STEP;
  }
  tickMic(dt);
  tickBed(dt);
  drainEvents();
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// spontaneous waves
poisson(() => params.restless / 60, () => { if (!document.hidden) flock.initiate(simT); });

// ---- start, dialogs, keys ----
const startEl = document.getElementById("start");
const outputsEl = document.getElementById("outputs");
const voicesEl = document.getElementById("voices");
const sinkEl = document.getElementById("sink");
startEl.hidden = false;

let wakeLock = null;
async function holdWake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && ac) holdWake(); });

let starting = false;
async function begin() {
  if (ac || starting) return;
  starting = true;
  startEl.textContent = "loading samples";
  let sink = "";
  try { sink = localStorage.getItem(STORE + ".sink") || ""; } catch (e) {}
  await startAudio(sink);
  holdWake();
  // mic on at start, via core's "a" key
  if (!audioActive()) window.dispatchEvent(new KeyboardEvent("keydown", { key: "a" }));
  await preloadAll();
  startEl.hidden = true;
  bedChord(CHORDS[chordIdx]);
  refreshOutputs();
}

async function refreshOutputs() {
  const info = document.getElementById("chan-info");
  info.textContent = ac
    ? `${ac.destination.maxChannelCount} channels · ${quad ? "quad" : "stereo"}`
    : "audio off";
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audiooutput");
  let cur = "";
  try { cur = localStorage.getItem(STORE + ".sink") || ""; } catch (e) {}
  sinkEl.innerHTML = "";
  for (const d of devs) {
    const o = document.createElement("option");
    o.value = d.deviceId === "default" ? "" : d.deviceId;
    o.textContent = d.label || "output " + (sinkEl.length + 1);
    if (o.value === cur) o.selected = true;
    sinkEl.appendChild(o);
  }
}
sinkEl.addEventListener("change", async () => {
  try { localStorage.setItem(STORE + ".sink", sinkEl.value); } catch (e) {}
  if (ac) { await startAudio(sinkEl.value); bedChord(CHORDS[chordIdx]); refreshOutputs(); }
});
outputsEl.querySelectorAll("[data-test]").forEach(b => b.addEventListener("click", () => speakerTest(+b.dataset.test)));

// voices dialog: pack list from samples-manifest.json (instruments, pads, bass)
let packList = null;
async function buildVoiceRows() {
  if (!packList) {
    try {
      const m = await (await fetch("samples-manifest.json")).json();
      packList = [];
      for (const cat of ["instruments", "pads", "bass"]) {
        const c = m.find(x => x.name === cat);
        if (c) for (const p of c.children) packList.push(`${cat}/${p.name}`);
      }
    } catch (e) { packList = []; }
  }
  const rows = document.getElementById("voice-rows");
  rows.innerHTML = "";
  for (const slot of VOICE_SLOTS) {
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("span");
    label.className = "label"; label.textContent = slot;
    const pack = document.createElement("select");
    const packs = packList.includes(voiceCfg[slot][0]) ? packList : [voiceCfg[slot][0], ...packList];
    for (const p of packs) {
      const o = document.createElement("option");
      o.value = p; o.textContent = p; o.selected = p === voiceCfg[slot][0];
      pack.appendChild(o);
    }
    const oct = document.createElement("select");
    oct.className = "oct";
    for (let v = -3; v <= 3; v++) {
      const o = document.createElement("option");
      o.value = v; o.textContent = (v > 0 ? "+" : "") + v; o.selected = v === voiceCfg[slot][1];
      oct.appendChild(o);
    }
    const change = () => {
      voiceCfg[slot] = [pack.value, +oct.value];
      saveVoices();
      if (ac) preloadSlot(slot);
    };
    pack.addEventListener("change", change);
    oct.addEventListener("change", change);
    row.append(label, pack, oct);
    rows.appendChild(row);
  }
}

function toggleDialog(el, other) {
  other.hidden = true;
  el.hidden = !el.hidden;
  document.body.style.cursor = el.hidden ? "" : "default";
  if (!el.hidden && el === outputsEl) refreshOutputs();
  if (!el.hidden && el === voicesEl) buildVoiceRows();
}

function setHush(on) {
  hushed = on;
  if (master) master.gain.setTargetAtTime(on ? 0.18 : 1, ac.currentTime, 1.2);
}

window.addEventListener("click", (e) => {
  if (e.target.closest("#panel, .dialog, #audio-panel")) return;
  if (!ac) { begin(); return; }
  // click: strike at the nearest bird
  let best = -1, bd = Infinity;
  const mx = e.clientX * dpr, my = e.clientY * dpr;
  for (let i = 0; i < flock.n; i++) {
    project(flock.px[i], flock.py[i], flock.pz[i]);
    const d = (proj[0] - mx) ** 2 + (proj[1] - my) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) strikeAt(flock.px[best], flock.py[best], flock.pz[best], 6);
});

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
  if (e.key === " ") { e.preventDefault(); flock.initiate(simT); }
  else if (e.key === "h" || e.key === "H") setHush(!hushed);
  else if (e.key === "o" || e.key === "O") toggleDialog(outputsEl, voicesEl);
  else if (e.key === "v" || e.key === "V") toggleDialog(voicesEl, outputsEl);
  else if (e.key === "f" || e.key === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});

window.onParamChange = (k) => {
  syncFlockParams();
  saveParams();
  if (k === "view") resize();
  if (!ac) return;
  if (k === "reverb") for (const r of plateRet) r.gain.setTargetAtTime(reverbReturn(), ac.currentTime, 0.05);
  if (k === "reverbSize" && plate) plate.port.postMessage({ size: params.reverbSize });
};
installPanel(params);

// reset flock: defaults back into the sliders (each fires onParamChange),
// including the wave settings in the top section
const WAVE_DEFAULTS = { k: 7, contagion: 1, restless: 5, reaction: 70, depth: 17 };
document.getElementById("flock-reset").addEventListener("click", () => {
  const all = Object.assign({}, WAVE_DEFAULTS, FLOCK_DEFAULTS);
  for (const k in all) {
    const input = document.querySelector(`#panel input[data-k="${k}"]`);
    input.value = all[k];
    input.dispatchEvent(new Event("input"));
  }
});

// readout, twice a second: alignment, pieces (birds within 3 m on screen
// are joined), spread (RMS radius), turning share
const statsEl = document.getElementById("flock-stats");
const ufPar = new Int32Array(MurmFlock.NMAX);
function ufFind(a) { while (ufPar[a] !== a) { ufPar[a] = ufPar[ufPar[a]]; a = ufPar[a]; } return a; }
function flockPieces() {
  const n = flock.n, L = 3, cells = new Map();
  for (let i = 0; i < n; i++) {
    ufPar[i] = i;
    const key = Math.floor(flock.px[i] / L) * 100003 + Math.floor(flock.py[i] / L);
    const c = cells.get(key); if (c) c.push(i); else cells.set(key, [i]);
  }
  for (let i = 0; i < n; i++) {
    const gx = Math.floor(flock.px[i] / L), gy = Math.floor(flock.py[i] / L);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const c = cells.get((gx + dx) * 100003 + gy + dy); if (!c) continue;
      for (const j of c) if (j > i && (flock.px[i] - flock.px[j]) ** 2 + (flock.py[i] - flock.py[j]) ** 2 < L * L) ufPar[ufFind(i)] = ufFind(j);
    }
  }
  const size = new Map();
  for (let i = 0; i < n; i++) { const r = ufFind(i); size.set(r, (size.get(r) || 0) + 1); }
  const sizes = [...size.values()];
  return [sizes.filter(v => v >= 0.05 * n).length, Math.max(...sizes) / n];
}
setInterval(() => {
  if (document.getElementById("panel").hidden) return;
  const s = flock.stats, [pc, big] = flockPieces();
  const now = performance.now();
  while (strikeTimes.length && now - strikeTimes[0] > 60000) strikeTimes.shift();
  statsEl.textContent = `alignment ${s.polarization.toFixed(2)} · pieces ${pc} (${Math.round(100 * big)}%) · spread ${s.extent.toFixed(0)} m · turning ${Math.round(100 * s.turning)}% · mic strikes ${strikeTimes.length}/min`;
}, 500);

// debug hooks for headless checks
window.murm = { flock, params, voiceCfg, buffers, kits, get simT() { return simT; }, get ac() { return ac; }, get activeVoices() { return activeVoices; }, get bedNotes() { return bed.notes.length; }, begin, strikeAt };
</script>
</body>
</html>
