<style>
  @font-face { font-family: "zxx-sans";  src: url("fonts/zxx-sans.woff2")         format("woff2"); font-display: swap; }
  @font-face { font-family: "zxx-noise"; src: url("fonts/zxx-noise.woff2")        format("woff2"); font-display: swap; }
  @font-face { font-family: "zxx-camo";  src: url("fonts/zxx-camo.woff2")         format("woff2"); font-display: swap; }
  @font-face { font-family: "zxx-xed";   src: url("fonts/zxx-xed.woff2")          format("woff2"); font-display: swap; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; color: #ccc; overflow: hidden; }
  body {
    width: 100vw; height: 100vh;
    font: 12px/1.5 "SF Mono", "Menlo", "Consolas", monospace;
  }

  /* the visualizer: a real N-*.html page in a frame. the room hands its core.js
     the AnalyserNode so the page reacts to the EP exactly as it would to a mic. */
  #viz { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 0; background: #050505; }

  /* scrim: the visualizers are dense and the sleeve has to read over them.
     a heavy fade on the left where the text lives, a light one along the
     bottom for the status line — the right half stays clear for the picture. */
  #scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(5,5,5,.94) 0%, rgba(5,5,5,.88) 32%, rgba(5,5,5,.55) 50%, rgba(5,5,5,0) 68%),
      radial-gradient(ellipse 520px 260px at 100% 0%, rgba(5,5,5,.9) 0%, rgba(5,5,5,.6) 55%, rgba(5,5,5,0) 100%),
      linear-gradient(0deg, rgba(5,5,5,.7) 0%, rgba(5,5,5,0) 14%);
  }

  /* the room overlays the frame; only the controls take the pointer so the
     page underneath still gets mouse movement everywhere else */
  #room { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #room > * { pointer-events: auto; }

  #sleeve {
    position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
    width: min(560px, calc(100vw - 56px));
  }
  h1 {
    font-family: "zxx-sans", ui-monospace, monospace;
    font-weight: 400; font-size: clamp(34px, 6vw, 64px); line-height: 1;
    letter-spacing: 0.04em; color: #eee; margin: 0 0 22px; cursor: default;
  }
  h1 [data-link] { display: inline-block; }

  ol#tracks { list-style: none; margin: 0; padding: 0; }
  #tracks li {
    display: grid; grid-template-columns: 26px 1fr auto; align-items: baseline; gap: 0 14px;
    padding: 9px 0; border-top: 1px solid #1c1c1c; color: #888;
  }
  #tracks li:last-child { border-bottom: 1px solid #1c1c1c; }
  #tracks li.current { color: #eee; }
  #tracks li.current .num::before { content: "▶"; }
  #tracks li.current.paused .num::before { content: "▮▮"; letter-spacing: -0.3em; }
  #tracks li.current.loading .num::before { content: "…"; }
  #tracks .num { color: #555; }
  #tracks li.current .num { color: #eee; }
  #tracks .num::before { content: attr(data-n); }
  #tracks .title {
    font-family: "zxx-sans", ui-monospace, monospace; font-size: 18px; letter-spacing: 0.06em;
    cursor: pointer; background: none; border: 0; color: inherit; padding: 0; text-align: left;
  }
  #tracks .title:hover { color: #fff; }
  #tracks .meta { color: #555; display: flex; gap: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tracks .dur { min-width: 4ch; text-align: right; }
  #tracks .note { grid-column: 2 / -1; color: #4a4a4a; font-size: 11px; }

  /* the ruin: three knobs on the record. clean at rest, gone at the end. */
  #ruin { margin-top: 18px; display: grid; grid-template-columns: 52px 1fr; gap: 8px 14px; align-items: center; color: #888; }
  #ruin .lbl { color: #555; letter-spacing: 0.18em; }
  #ruin .row { display: flex; align-items: center; gap: 12px; }
  #ruin input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 18px; background: transparent; cursor: pointer; margin: 0;
  }
  #ruin input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #333; }
  #ruin input[type=range]::-moz-range-track { height: 1px; background: #333; }
  #ruin input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 18px; margin-top: -8.5px; background: #ddd; border: 0; border-radius: 0;
  }
  #ruin input[type=range]::-moz-range-thumb { width: 10px; height: 18px; background: #ddd; border: 0; border-radius: 0; }
  #ruin .val { min-width: 11ch; text-align: right; color: #eee; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ruin .val small { color: #666; }
  #ruin .seedrow { grid-column: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 11px; color: #555; margin-top: 4px; }
  #ruin .seed { color: #999; letter-spacing: 0.08em; }
  #ruin button { background: none; border: 1px solid #333; color: #999; font: inherit; padding: 3px 9px; cursor: pointer; letter-spacing: 0.06em; }
  #ruin button:hover { border-color: #888; color: #eee; }
  #ruin button:disabled { opacity: .4; cursor: default; }
  #ruin button.reseed { padding: 3px 7px; }
  #ruin .state { color: #444; }
  #ruin .state.on { color: #777; }

  #buy {
    position: absolute; right: 28px; top: calc(28px + var(--ns-nav-h, 0px));
    text-align: right;
  }
  #buy a.cta {
    display: inline-block; border: 1px solid #555; color: #eee; padding: 10px 18px;
    text-decoration: none; letter-spacing: 0.16em; text-transform: lowercase;
  }
  #buy a.cta:hover { border-color: #eee; }
  #buy a.cta.pending { border-style: dashed; color: #777; pointer-events: none; }
  #buy .stream { color: #555; margin-top: 8px; }

  #status {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: #555; white-space: nowrap; text-align: center;
  }
  #status b { color: #999; font-weight: 400; }
  #status .keys { display: block; margin-top: 3px; font-size: 11px; color: #444; }

  /* progress: the whole bottom edge is the scrubber */
  #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; cursor: pointer; }
  #progress .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #1c1c1c; }
  #progress .fill { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #ddd; }
  #progress .buf { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #333; }

  #toast {
    position: absolute; left: 50%; top: calc(28px + var(--ns-nav-h, 0px)); transform: translateX(-50%);
    background: #050505; border: 1px solid #333; color: #ccc; padding: 6px 12px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  #toast.on { opacity: 1; }

  @media (max-width: 720px) {
    #scrim {
      background:
        linear-gradient(0deg, rgba(5,5,5,.94) 0%, rgba(5,5,5,.9) 48%, rgba(5,5,5,.3) 70%, rgba(5,5,5,0) 100%),
        linear-gradient(180deg, rgba(5,5,5,.8) 0%, rgba(5,5,5,0) 26%);
    }
    #sleeve { left: 16px; right: 16px; top: auto; bottom: 64px; transform: none; width: auto; }
    h1 { margin-bottom: 14px; }
    #tracks li { grid-template-columns: 22px 1fr; }
    #tracks .meta { grid-column: 2; }
    #buy { left: 16px; right: 16px; text-align: left; }
    #status .keys { display: none; }
  }
</style>
</head>
<body>
<iframe id="viz" title="visualizer" allow="midi"></iframe>
<div id="scrim"></div>

<div id="room">
  <div id="sleeve">
    <h1><span data-link id="title"></span></h1>
    <ol id="tracks"></ol>
    <div id="ruin">
      <span class="lbl">ruin</span>
      <div class="row">
        <input type="range" id="k-ruin" min="0" max="1" step="0.01" value="0" aria-label="ruin amount">
        <span class="val" id="v-ruin">0.00</span>
      </div>
      <span class="lbl">speed</span>
      <div class="row">
        <input type="range" id="k-speed" min="0" max="1" step="0.001" value="0.75" aria-label="speed">
        <span class="val" id="v-speed">1.00×</span>
      </div>
      <span class="lbl">reverb</span>
      <div class="row">
        <input type="range" id="k-verb" min="0" max="1" step="0.01" value="0" aria-label="reverb">
        <span class="val" id="v-verb">0.00</span>
      </div>
      <div class="seedrow">
        <span>seed <span class="seed" id="ruin-seed"></span></span>
        <button class="reseed" id="ruin-reseed" title="another wreck at the same settings">⟳</button>
        <button id="ruin-keep" title="print the whole track through these settings and download it">keep this ruin ↓</button>
        <button id="ruin-share" title="copy a link — the room opens on this track with these exact settings">share</button>
        <span class="state" id="ruin-state"></span>
      </div>
    </div>
  </div>
  <div id="buy"></div>
  <div id="status"><b id="viz-name"></b><span class="keys">[space] play · [←→] track · [ ] visualizer · [0] params · [9] levels · [c] copy state</span></div>
  <div id="progress"><div class="bar"></div><div class="buf"></div><div class="fill"></div></div>
  <div id="toast"></div>
</div>

<script src="nav.js"></script>
<script>
(async () => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const viz = $("viz");
  const SR = 48000; // everything runs at one rate: decode, live, print

  const EP_URL = new URLSearchParams(location.search).get("ep") || "assets/ep/night-school.json";
  const ep = await (await fetch(EP_URL)).json();
  const VIZ = ep.visualizers || [];
  let cur = -1;          // current track index
  let pageOverride = {}; // slug → page picked live with [ ] (not persisted — press c to copy)

  // ---- sleeve ------------------------------------------------------------------
  $("title").textContent = ep.title;
  const fmt = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(x).padStart(2, "0"); };
  const audioUrl = (t) => (ep.audioBase || "") + t.file;
  const list = $("tracks");
  ep.tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.dataset.i = i;
    li.innerHTML = `
      <span class="num" data-n="${String(i + 1).padStart(2, "0")}"></span>
      <button class="title" data-link>${t.title}</button>
      <span class="meta"><span class="dur">${t.duration ? fmt(t.duration) : ""}</span></span>
      ${t.note ? `<span class="note">${t.note}</span>` : ""}`;
    li.querySelector(".title").addEventListener("click", (e) => { e.currentTarget.blur(); (i === cur ? togglePlay() : play(i)); });
    list.appendChild(li);
  });
  const durEl = (i) => list.querySelector(`li[data-i="${i}"] .dur`);

  // ---- buy / streaming ---------------------------------------------------------
  {
    const b = ep.buy || {};
    const a = document.createElement("a");
    a.className = "cta" + (b.url ? "" : " pending");
    a.href = b.url || "#";
    if (b.url) { a.target = "_blank"; a.rel = "noopener"; }
    a.textContent = b.label || "buy";
    a.setAttribute("data-link", "");
    $("buy").appendChild(a);
    const s = ep.streaming || {};
    if (s.date || s.note) {
      const p = document.createElement("div");
      p.className = "stream";
      p.textContent = s.date ? `streaming everywhere ${s.date}` : s.note;
      $("buy").appendChild(p);
    }
  }

  // ---- the record: fetched once, decoded once, handed to the worklet ------------
  // the worklet is the player (see ruin-worklet.js), so the whole file has to
  // be in memory before the first note. the track row shows the fetch.
  const decoded = new Map(); // slug → AudioBuffer (keep two: current + last)
  async function loadTrack(t, onProgress) {
    if (decoded.has(t.slug)) return decoded.get(t.slug);
    const res = await fetch(audioUrl(t));
    if (!res.ok) throw new Error(`${res.status} fetching ${t.file}`);
    const total = +res.headers.get("content-length") || 0;
    let bytes;
    if (res.body && total) {
      const reader = res.body.getReader();
      const chunks = []; let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        if (onProgress) onProgress(got / total);
      }
      bytes = new Uint8Array(got); let o = 0;
      for (const c of chunks) { bytes.set(c, o); o += c.length; }
      bytes = bytes.buffer;
    } else {
      bytes = await res.arrayBuffer();
    }
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const buf = await new Ctx(2, 1, SR).decodeAudioData(bytes); // resamples to SR
    for (const k of [...decoded.keys()].slice(0, -1)) decoded.delete(k);
    decoded.set(t.slug, buf);
    return buf;
  }

  // ---- audio graph: worklet(player+ruin) → [dry] + [convolver → wet] → analyser → out ----
  let actx = null, analyser = null, node = null, conv = null, dryGain = null, wetGain = null, graphReady = null;
  let playing = false, posFrame = 0, lenFrames = 0;
  function ensureGraph() {
    if (graphReady) return graphReady;
    graphReady = (async () => {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      try { actx = new Ctx({ sampleRate: SR }); } catch (_) { actx = new Ctx(); }
      await actx.audioWorklet.addModule("ruin-worklet.js");
      node = new AudioWorkletNode(actx, "ruin", { numberOfInputs: 0, outputChannelCount: [2] });
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;            // matches core.js's mic analyser
      analyser.smoothingTimeConstant = 0; // core.js does its own smoothing
      conv = actx.createConvolver(); conv.normalize = false;
      dryGain = actx.createGain(); wetGain = actx.createGain();
      node.connect(dryGain); node.connect(conv); conv.connect(wetGain);
      // the analyser sits AFTER everything: the visualizer reacts to what you hear
      dryGain.connect(analyser); wetGain.connect(analyser);
      analyser.connect(actx.destination);
      node.port.onmessage = (e) => {
        const m = e.data;
        if (m.type === "pos") posFrame = m.frame;
        else if (m.type === "ended") { playing = false; markCurrent(); if (cur + 1 < ep.tracks.length) play(cur + 1); }
      };
      applyVerb(actx, conv, dryGain, wetGain, knobs.verb, knobs.seed);
      pushSet();
    })();
    return graphReady;
  }
  function frameNS() {
    try { return viz.contentWindow && viz.contentWindow.Newspeech; } catch (_) { return null; }
  }
  function attach() {
    const NS = frameNS();
    if (NS && NS.attachAnalyser && analyser) NS.attachAnalyser(analyser);
  }

  // ---- the visualizer frame ---------------------------------------------------
  function pageFor(t) { return pageOverride[t.slug] || t.page || VIZ[0]; }
  function loadFrame(t) {
    const page = pageFor(t);
    $("viz-name").textContent = page.replace(/^\d+-/, "");
    viz.src = `${page}.html`;
  }
  viz.addEventListener("load", () => {
    const t = ep.tracks[cur];
    const NS = frameNS();
    if (!t || !NS) return;
    // tuned params — same dispatch reel-render uses, so the page looks the same
    // here as it will in the rendered video
    const params = (t.state && t.state.params) || {};
    const doc = viz.contentDocument;
    for (const [k, val] of Object.entries(params)) {
      const el = doc.querySelector(`#panel [data-k="${k}"]`);
      if (!el) continue;
      el.value = val;
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }
    if (t.beat && t.bpm && NS.setBpm) NS.setBpm(t.bpm); else if (NS.clearBpm) NS.clearBpm();
    // the room is a listening surface first: start with the page's params
    // panel closed ([0] in the frame still opens it — it's hidden, not removed)
    const panel = doc.getElementById("panel");
    if (panel) panel.hidden = true;
    applyQuiet(doc, NS);
    attach();
    // the frame owns the keyboard once clicked — mirror the room's keys back
    viz.contentWindow.addEventListener("keydown", onKey);
  });
  // quiet layer: the visualizers were built to hold a screen alone; behind a
  // record they sit back. dim = frame opacity over the #050505 body; the site
  // globals are applied for this load only (persist=false) so a visitor's own
  // haze/grain/data-points settings survive; the telemetry HUD is hidden by
  // style rather than toggled, for the same reason. all values live in the
  // EP config so the room and the rendered videos agree.
  const quiet = ep.quiet || {};
  if (quiet.dim != null) viz.style.opacity = String(quiet.dim);
  function applyQuiet(doc, NS) {
    if (quiet.haze != null && NS.setHaze) NS.setHaze(quiet.haze, false);
    if (quiet.grain != null && NS.setGrain) NS.setGrain(quiet.grain, false);
    if (quiet.dataPoints != null && NS.setDataPoints) NS.setDataPoints(quiet.dataPoints, false);
    if (quiet.telemetry === false) {
      const st = doc.createElement("style");
      st.textContent = "#hud-overlay{display:none !important}";
      doc.head.appendChild(st);
    }
  }

  // keep the page fed: re-attach if it dropped the analyser (someone pressed a
  // for the mic, or the page swapped) and mirror the transport state
  function tick() {
    const NS = frameNS();
    if (NS && analyser && NS.audioActive && !NS.audioActive() && playing) attach();
    if (lenFrames) $("progress").querySelector(".fill").style.width = `${(posFrame / lenFrames) * 100}%`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- transport ---------------------------------------------------------------
  let loadingSlug = null;
  function markCurrent() {
    list.querySelectorAll("li").forEach((li) => {
      const i = +li.dataset.i;
      li.classList.toggle("current", i === cur);
      li.classList.toggle("paused", i === cur && !playing && loadingSlug !== ep.tracks[i].slug);
      li.classList.toggle("loading", i === cur && loadingSlug === ep.tracks[i].slug);
    });
  }
  async function play(i) {
    const t = ep.tracks[i];
    if (!t) return;
    await ensureGraph();
    await actx.resume();
    if (i !== cur || !decoded.has(t.slug)) {
      const switching = i !== cur;
      cur = i;
      if (switching) { loadFrame(t); posFrame = 0; lenFrames = 0; }
      node.port.postMessage({ type: "play", on: false }); playing = false;
      loadingSlug = t.slug; markCurrent(); syncUrl();
      const d = durEl(i);
      let buf;
      try {
        buf = await loadTrack(t, (f) => { d.textContent = `${Math.round(f * 100)}%`; $("progress").querySelector(".buf").style.width = `${f * 100}%`; });
      } catch (err) {
        console.error(err); d.textContent = "failed"; loadingSlug = null; markCurrent(); toast(`couldn't load ${t.title}`); return;
      }
      if (cur !== i) return; // someone moved on while we were loading
      loadingSlug = null;
      d.textContent = fmt(buf.duration);
      $("progress").querySelector(".buf").style.width = "100%";
      lenFrames = buf.length;
      { const l = buf.getChannelData(0).slice(), r = (buf.numberOfChannels > 1 ? buf.getChannelData(1) : buf.getChannelData(0)).slice();
        node.port.postMessage({ type: "buffer", l, r, sr: buf.sampleRate }, [l.buffer, r.buffer]); }
      node.port.postMessage({ type: "seek", frame: 0 });
      pushSet(); showKnobs();
    }
    node.port.postMessage({ type: "play", on: true }); playing = true;
    markCurrent();
  }
  async function togglePlay() {
    if (cur < 0 || !decoded.has(ep.tracks[cur].slug)) return play(cur < 0 ? 0 : cur);
    await ensureGraph();
    await actx.resume();
    playing = !playing;
    node.port.postMessage({ type: "play", on: playing });
    markCurrent();
  }
  $("progress").addEventListener("click", (e) => {
    if (!lenFrames || !node) return;
    const r = e.currentTarget.getBoundingClientRect();
    posFrame = ((e.clientX - r.left) / r.width) * lenFrames;
    node.port.postMessage({ type: "seek", frame: posFrame });
  });

  // ---- the ruin: three knobs + a seed are the whole take -------------------------
  // amount/speed/reverb/seed reproduce a take exactly: the worklet decides
  // positionally, the reverb impulse is seeded, and the print runs the same
  // graph offline. speed is tape-style (pitch follows) — 0.125× makes a
  // 5-minute record a 40-minute one.
  const knobs = { ruin: 0, speed: 1, verb: 0, seed: "" };
  const randomSeed = () => Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
  const speedFromSlider = (v) => 0.125 * Math.pow(2, 4 * v);   // 0..1 → 0.125×..2×, 0.75 = 1×
  const sliderFromSpeed = (s) => Math.log2(s / 0.125) / 4;
  const K = { ruin: $("k-ruin"), speed: $("k-speed"), verb: $("k-verb") };
  const V = { ruin: $("v-ruin"), speed: $("v-speed"), verb: $("v-verb") };
  const seedEl = $("ruin-seed"), stateEl = $("ruin-state"), keepBtn = $("ruin-keep");

  function pushSet() {
    const t = ep.tracks[cur < 0 ? 0 : cur];
    if (node) node.port.postMessage({ type: "set", amount: knobs.ruin, seed: knobs.seed, bpm: (t && t.bpm) || 120, speed: knobs.speed });
  }
  function takeSeconds() {
    const t = ep.tracks[cur < 0 ? 0 : cur];
    const d = lenFrames ? lenFrames / SR : (t && t.duration) || 0;
    return d / knobs.speed;
  }
  function showKnobs() {
    K.ruin.value = String(knobs.ruin); V.ruin.textContent = knobs.ruin.toFixed(2);
    K.speed.value = String(sliderFromSpeed(knobs.speed));
    V.speed.innerHTML = `${knobs.speed.toFixed(2)}× <small>${fmt(takeSeconds())}</small>`;
    K.verb.value = String(knobs.verb); V.verb.textContent = knobs.verb.toFixed(2);
    seedEl.textContent = knobs.seed;
    const touched = knobs.ruin > 0 || knobs.speed !== 1 || knobs.verb > 0;
    stateEl.textContent = touched ? "ruined" : "clean";
    stateEl.classList.toggle("on", touched);
    keepBtn.disabled = !touched || printing;
    if (!printing) keepBtn.textContent = touched ? `keep this ruin ↓ ~${Math.round(takeSeconds() * SR * 6 / 1048576)} MB` : "keep this ruin ↓";
  }
  function syncUrl() {
    if (!history.replaceState) return;
    const q = new URLSearchParams();
    const t = ep.tracks[cur];
    if (t) q.set("t", t.slug);
    if (knobs.ruin > 0) q.set("ruin", knobs.ruin.toFixed(2));
    if (knobs.speed !== 1) q.set("speed", knobs.speed.toFixed(3));
    if (knobs.verb > 0) q.set("verb", knobs.verb.toFixed(2));
    if (knobs.ruin > 0 || knobs.verb > 0) q.set("seed", knobs.seed);
    if (EP_URL !== "assets/ep/night-school.json") q.set("ep", EP_URL);
    const qs = q.toString();
    history.replaceState(null, "", location.pathname + (qs ? `?${qs}` : ""));
  }
  K.ruin.addEventListener("input", () => { knobs.ruin = +K.ruin.value; showKnobs(); pushSet(); syncUrl(); });
  K.speed.addEventListener("input", () => { knobs.speed = +speedFromSlider(+K.speed.value).toFixed(3); showKnobs(); pushSet(); syncUrl(); });
  K.speed.addEventListener("dblclick", () => { knobs.speed = 1; showKnobs(); pushSet(); syncUrl(); });
  // reverb: mix follows the knob live; the impulse (tail length) is rebuilt on
  // release, since swapping a convolver's buffer mid-drag stutters
  K.verb.addEventListener("input", () => { knobs.verb = +K.verb.value; showKnobs(); if (actx) applyVerb(actx, conv, dryGain, wetGain, knobs.verb, knobs.seed, true); syncUrl(); });
  K.verb.addEventListener("change", () => { if (actx) applyVerb(actx, conv, dryGain, wetGain, knobs.verb, knobs.seed); });
  $("ruin-reseed").addEventListener("click", () => { knobs.seed = randomSeed(); showKnobs(); pushSet(); if (actx) applyVerb(actx, conv, dryGain, wetGain, knobs.verb, knobs.seed); syncUrl(); });
  $("ruin-share").addEventListener("click", async () => {
    syncUrl();
    try { await navigator.clipboard.writeText(location.href); toast("link copied — it opens on this track with these settings"); }
    catch (_) { toast("link is in the address bar"); }
  });

  // ---- reverb: a seeded impulse in a ConvolverNode --------------------------------
  // one knob: wet amount and tail together. decorrelated noise under an
  // exponential decay that darkens as it goes — plain, long, and identical
  // in the print because the noise is seeded.
  const verbParams = (r) => ({ decay: 1.2 + r * r * 11, wet: r * 0.9, dry: 1 - 0.35 * r }); // tail 1.2s → 12.2s
  function makeImpulse(ctx, seconds, seedStr) {
    const n = Math.max(1, Math.round(seconds * SR));
    const ir = ctx.createBuffer(2, n, SR);
    let s = 0x811c9dc5; for (let i = 0; i < seedStr.length; i++) { s ^= seedStr.charCodeAt(i); s = Math.imul(s, 0x01000193) >>> 0; }
    const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / n;
        const env = Math.exp(-6.5 * t) * (1 - t);           // ~-56 dB at the end, then to zero
        const k = 0.9 - 0.75 * t;                           // one-pole darkening along the tail
        lp += ((rnd() * 2 - 1) - lp) * k;
        d[i] = lp * env * (i < 480 ? i / 480 : 1);          // 10ms fade-in: no click on the direct
      }
    }
    // normalise the impulse energy so the knob's wet level is stable across tail lengths
    let e = 0; const d0 = ir.getChannelData(0); for (let i = 0; i < n; i++) e += d0[i] * d0[i];
    const g = 0.35 / Math.sqrt(e + 1e-9); // convolution gain for noise ≈ sqrt(Σ ir²)
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] *= g; }
    return ir;
  }
  let irKey = "";
  function applyVerb(ctx, c, dry, wet, r, seedStr, mixOnly = false) {
    const p = verbParams(r);
    const t = ctx.currentTime;
    dry.gain.setTargetAtTime(p.dry, t, 0.03);
    wet.gain.setTargetAtTime(p.wet, t, 0.03);
    const key = `${p.decay.toFixed(2)}|${seedStr}`;
    if (!mixOnly && key !== irKey) { irKey = key; c.buffer = makeImpulse(ctx, p.decay, seedStr); }
  }

  // ---- keep: the whole record through the same graph, offline, to a 24-bit wav ----
  // rendered in one-minute pieces with a pre-roll (the reverb tail + a
  // margin) so a 40-minute take doesn't need a gigabyte of float32: the
  // worklet is positional, so a piece started from any frame is exactly the
  // stream from that frame, and the pre-roll gives the convolver its history.
  const PRINT_CHUNK_S = 60;
  async function renderTake(t, k, onProgress, chunkS = PRINT_CHUNK_S) {
    const buf = await loadTrack(t);
    const p = verbParams(k.verb);
    const preroll = k.verb > 0 ? p.decay + 0.5 : 0.05;
    const totalOut = Math.ceil(buf.length / k.speed);
    const chunkFrames = Math.round(chunkS * SR), preFrames = Math.round(preroll * SR);
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    const parts = []; let done = 0;
    for (let start = 0; start < totalOut; start += chunkFrames) {
      const len = Math.min(chunkFrames, totalOut - start);
      const oc = new Ctx(2, preFrames + len, SR);
      await oc.audioWorklet.addModule("ruin-worklet.js");
      const n = new AudioWorkletNode(oc, "ruin", { numberOfInputs: 0, outputChannelCount: [2] });
      const c = oc.createConvolver(); c.normalize = false; c.buffer = makeImpulse(oc, p.decay, k.seed);
      const dg = oc.createGain(), wg = oc.createGain(); dg.gain.value = p.dry; wg.gain.value = p.wet;
      n.connect(dg); n.connect(c); c.connect(wg); dg.connect(oc.destination); wg.connect(oc.destination);
      const ack = new Promise((res) => { n.port.onmessage = (e) => { if (e.data.type === "ack") res(); }; });
      { const l = L.slice(), r = R.slice(); n.port.postMessage({ type: "buffer", l, r, sr: buf.sampleRate }, [l.buffer, r.buffer]); }
      n.port.postMessage({ type: "seek", frame: (start - preFrames) * k.speed });
      n.port.postMessage({ type: "set", amount: k.ruin, seed: k.seed, bpm: t.bpm || 120, speed: k.speed });
      await ack;
      n.port.postMessage({ type: "play", on: true });
      const out = await oc.startRendering();
      parts.push(encodePcm24(out, preFrames, len));
      done += len;
      if (onProgress) onProgress(done / totalOut);
    }
    return { parts, frames: totalOut };
  }
  function encodePcm24(b, from, count) {
    const l = b.getChannelData(0), r = b.numberOfChannels > 1 ? b.getChannelData(1) : l;
    const bytes = new Uint8Array(count * 6);
    let o = 0;
    for (let i = from; i < from + count; i++) {
      for (const v of [l[i], r[i]]) {
        const x = Math.round(Math.max(-1, Math.min(1, v)) * 8388607);
        bytes[o++] = x & 255; bytes[o++] = (x >> 8) & 255; bytes[o++] = (x >> 16) & 255;
      }
    }
    return bytes;
  }
  function wavHeader(frames) {
    const dataBytes = frames * 6, ab = new ArrayBuffer(44), dv = new DataView(ab);
    const str = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
    str(0, "RIFF"); dv.setUint32(4, 36 + dataBytes, true); str(8, "WAVE"); str(12, "fmt ");
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true);
    dv.setUint32(28, SR * 6, true); dv.setUint16(32, 6, true); dv.setUint16(34, 24, true);
    str(36, "data"); dv.setUint32(40, dataBytes, true);
    return ab;
  }
  let printing = false;
  keepBtn.addEventListener("click", async () => {
    if (printing || keepBtn.disabled) return;
    const t = ep.tracks[cur < 0 ? 0 : cur];
    const k = { ...knobs };
    printing = true; keepBtn.disabled = true; keepBtn.textContent = "printing 0%";
    try {
      const { parts, frames } = await renderTake(t, k, (f) => { keepBtn.textContent = `printing ${Math.round(f * 100)}%`; });
      const blob = new Blob([wavHeader(frames), ...parts], { type: "audio/wav" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const bits = [`ruin${k.ruin.toFixed(2)}`];
      if (k.speed !== 1) bits.push(`x${k.speed.toFixed(2)}`);
      if (k.verb > 0) bits.push(`verb${k.verb.toFixed(2)}`);
      a.download = `${(ep.title || "ep").replace(/\s+/g, "-")}-${t.slug}-${bits.join("-")}-${k.seed}.wav`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      toast(`kept — ${a.download} (${fmt(frames / SR)})`);
    } catch (err) {
      console.error(err); toast("print failed — see console");
    } finally {
      printing = false; showKnobs();
    }
  });
  // test hook — headless checks call this to prove print determinism
  window.__nightSchool = { renderTake, loadTrack, knobs, tracks: ep.tracks, makeImpulse, verbParams };

  // ---- auditioning: cycle visualizers, copy the pairing out ----------------------
  function cycleViz(dir) {
    const t = ep.tracks[cur < 0 ? 0 : cur];
    const i = Math.max(0, VIZ.indexOf(pageFor(t)));
    pageOverride[t.slug] = VIZ[(i + dir + VIZ.length) % VIZ.length];
    if (cur < 0) { cur = 0; markCurrent(); }
    loadFrame(t);
  }
  function copyState() {
    const t = ep.tracks[cur < 0 ? 0 : cur];
    const params = {};
    const doc = viz.contentDocument;
    if (doc) doc.querySelectorAll("#panel [data-k]").forEach((el) => {
      if (el.closest("[data-global]")) return; // site-wide globals aren't the pairing
      params[el.dataset.k] = isNaN(+el.value) ? el.value : +el.value;
    });
    const snap = { page: pageFor(t), state: { params } };
    const json = JSON.stringify(snap, null, 2);
    navigator.clipboard.writeText(json).then(
      () => toast(`copied ${t.slug} → ${snap.page} · paste into ${EP_URL}`),
      () => { console.log(json); toast("clipboard blocked — state logged to console"); });
  }
  let toastTimer = null;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2800);
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.key !== " ") return;
    switch (e.key) {
      case " ": e.preventDefault(); togglePlay(); break;
      case "ArrowRight": play(Math.min(ep.tracks.length - 1, Math.max(0, cur + 1))); break;
      case "ArrowLeft": play(Math.max(0, cur - 1)); break;
      case "]": cycleViz(1); break;
      case "[": cycleViz(-1); break;
      case "c": case "C": copyState(); break;
      default: return;
    }
  }
  window.addEventListener("keydown", onKey);

  // show the first pairing before anyone presses play — or the shared take
  {
    const q = new URLSearchParams(location.search);
    const want = ep.tracks.findIndex((t) => t.slug === q.get("t"));
    cur = want >= 0 ? want : 0;
    knobs.seed = (q.get("seed") || "").trim().slice(0, 32) || randomSeed();
    knobs.ruin = Math.max(0, Math.min(1, parseFloat(q.get("ruin")) || 0));
    knobs.speed = Math.max(0.125, Math.min(2, parseFloat(q.get("speed")) || 1));
    knobs.verb = Math.max(0, Math.min(1, parseFloat(q.get("verb")) || 0));
    showKnobs();
    loadFrame(ep.tracks[cur]); markCurrent();
  }

  // ---- the text treatment (home-page signature, trimmed to what this page has) ----
  const FONTS = ["zxx-sans", "zxx-noise", "zxx-camo", "zxx-xed"];
  const SCRAMBLE = "#*/\\_+=~<>.,:;|?!@$%^&-";
  if (document.fonts && document.fonts.load) {
    await Promise.all(FONTS.map((f) => document.fonts.load(`13px "${f}"`))).catch(() => {});
  }
  document.querySelectorAll("[data-link]").forEach((link) => {
    const txt = link.textContent; link.textContent = "";
    const spans = [...txt].map((ch) => {
      const s = document.createElement("span");
      s.textContent = ch; s.dataset.original = ch; s.style.display = "inline-block"; s.style.whiteSpace = "pre";
      link.appendChild(s); return s;
    });
    const idx = spans.map(() => (Math.random() * FONTS.length) | 0);
    let timer = null;
    link.addEventListener("mouseenter", () => {
      if (timer) return;
      timer = setInterval(() => {
        for (let i = 0; i < spans.length; i++) {
          idx[i] = (idx[i] + 1) % FONTS.length;
          spans[i].style.fontFamily = `"${FONTS[idx[i]]}", monospace`;
        }
      }, 80);
    });
    link.addEventListener("mouseleave", () => { clearInterval(timer); timer = null; spans.forEach((s) => { s.style.fontFamily = ""; }); });
    (function schedule() {
      const wait = -Math.log(1 - Math.random()) * 6000 + 1500;
      setTimeout(() => {
        const n = 1 + ((Math.random() * Math.max(1, spans.length / 4)) | 0);
        const hit = [];
        for (let k = 0; k < n; k++) {
          const s = spans[(Math.random() * spans.length) | 0];
          if (s.dataset.original === " ") continue;
          s.textContent = SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0]; hit.push(s);
        }
        setTimeout(() => hit.forEach((s) => { s.textContent = s.dataset.original; }), 200);
        schedule();
      }, wait);
    })();
  });
})();
</script>
</body>
