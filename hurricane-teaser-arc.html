<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex, nofollow">
<title>NEWSPEECH // hurricane teaser — arc</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; cursor: none; }
  body { width: 100vw; height: 100vh; }
  #bg { position: fixed; inset: 0; display: block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="panel">
  <div class="panel-title">hurricane teaser · params · [0] toggle</div>
  <label>
    <span class="name">duration (s)</span><span class="val"></span>
    <input type="range" min="10" max="90" step="0.1" data-k="dur">
  </label>
  <label>
    <span class="name">mark weight</span><span class="val"></span>
    <input type="range" min="0.4" max="2.5" step="0.05" data-k="weight">
  </label>
  <label>
    <span class="name">arc haze</span><span class="val"></span>
    <input type="range" min="0" max="3" step="0.05" data-k="arcHaze">
  </label>
  <label>
    <span class="name">flicker</span><span class="val"></span>
    <input type="range" min="0" max="1" step="0.02" data-k="flicker">
  </label>
  <label>
    <span class="name">row lines</span><span class="val"></span>
    <input type="range" min="0" max="1" step="0.02" data-k="rows">
  </label>
</div>

<script src="core.js"></script>
<script>
const { installInputs, tickInputs, bumpActivity, intensity, audioLevel, bandLevel, onset,
        drawSoftDot, hazeAlongLine, installPanel } = window.Newspeech;

// hurricane melissa (2025), HURDAT2 best track: [lat, lon, wind kt, pressure mb]
const PTS = [[14,-70,40,1003],[14,-71.4,45,1003],[14,-72.4,45,1003],[14.1,-73.3,45,1003],[14.2,-73.5,45,1002],[14.3,-73.7,45,1002],[14.3,-74.1,45,1002],[14.3,-74.5,45,1002],[14.7,-74.8,40,1003],[15.2,-75,40,1003],[15.5,-75.3,40,1002],[15.7,-75.5,40,1002],[15.8,-75.3,40,1002],[15.9,-75.1,45,1000],[15.9,-74.8,50,997],[16.1,-74.7,55,993],[16.3,-74.7,60,986],[16.4,-74.9,60,984],[16.4,-75.3,75,976],[16.4,-75.7,90,971],[16.3,-76,105,958],[16.3,-76.4,115,952],[16.3,-76.9,120,944],[16.3,-77.3,125,934],[16.3,-77.7,135,923],[16.3,-78,145,912],[16.4,-78.3,155,906],[16.5,-78.6,155,909],[16.9,-78.4,155,900],[17.5,-78.1,165,892],[18.1,-78,160,897],[18.2,-78,145,910],[18.8,-77.1,105,953],[19.7,-76.4,105,952],[20,-76.2,100,954],[20.9,-75.8,85,968],[22.1,-75.4,80,972],[23.1,-75,80,972],[23.5,-74.8,80,970],[24,-74.5,80,970],[25,-73.8,85,968],[26.7,-72.7,90,965],[28.9,-70.9,85,967],[31.3,-68.7,80,970],[34.5,-65.5,75,972],[37.7,-62.1,75,972],[40.6,-58.9,70,972],[43.7,-56,70,971],[46.6,-51.3,65,968]];
const W_MIN = 40, W_MAX = 165;

const params = { dur: 46.7, weight: 1.2, arcHaze: 1, flicker: 0.4, rows: 0.5 };

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// per-fix stable flicker phase
const PHASE = PTS.map((_, i) => Math.random() * Math.PI * 2);

let elapsed = 0;
let rings = []; // onset rings: {x, y, r, a}

function frame(t, dt) {
  ctx.clearRect(0, 0, W, H);
  elapsed += dt;
  const progress = Math.min(1, elapsed / params.dur);
  const level = intensity();
  // raw low band for the head — unsmoothed, so the kick lands ON the frame
  const kick = Math.max(level, bandLevel("low"));

  // the staff: transcription band across the middle of the frame
  const x0 = W * 0.08, x1 = W * 0.92;
  const yTop = H * 0.24, yBot = H * 0.76;
  const xAt = i => x0 + (x1 - x0) * (i / (PTS.length - 1));
  const yAt = w => yBot - (yBot - yTop) * ((w - W_MIN) / (W_MAX - W_MIN));

  // faint pitch rows
  if (params.rows > 0) {
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${(0.05 * params.rows).toFixed(3)})`;
    ctx.lineWidth = 1;
    for (let r = 0; r <= 12; r++) {
      const y = yTop + (yBot - yTop) * (r / 12);
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    ctx.restore();
  }

  const head = progress * (PTS.length - 1);
  const headI = Math.floor(head);

  // the whole arc as a faint ghost from frame one — the record already
  // exists; playback traces it
  for (let i = 0; i < PTS.length; i++) {
    const wNorm = (PTS[i][2] - W_MIN) / (W_MAX - W_MIN);
    drawSoftDot(ctx, xAt(i), yAt(PTS[i][2]), (14 + wNorm * 30) * params.weight, 0.06);
  }

  // head scanline through the band
  {
    const hx = x0 + (x1 - x0) * (head / (PTS.length - 1));
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${(0.10 + kick * 0.30).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hx, yTop - 30); ctx.lineTo(hx, yBot + 30); ctx.stroke();
    ctx.restore();
  }

  // revealed fixes: the storm's intensity arc, mark weight follows wind
  for (let i = 0; i <= headI; i++) {
    const wind = PTS[i][2];
    const x = xAt(i), y = yAt(wind);
    const wNorm = (wind - W_MIN) / (W_MAX - W_MIN);
    const isHead = i === headI;
    const flick = 1 - params.flicker * 0.4 * (0.5 + 0.5 * Math.sin(t * 0.004 + PHASE[i]));
    const size = (14 + wNorm * 30) * params.weight * (isHead ? 1.3 + kick * 1.2 : 1);
    const alpha = (0.28 + wNorm * 0.5) * flick * (isHead ? 0.9 + kick * 0.5 : 1);
    drawSoftDot(ctx, x, y, size, Math.min(1, alpha));
    // stem down to the baseline, weight from wind
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${(0.05 + wNorm * 0.1).toFixed(3)})`;
    ctx.lineWidth = 1 + wNorm * 2;
    ctx.beginPath(); ctx.moveTo(x, y + size * 0.4); ctx.lineTo(x, yBot + 14); ctx.stroke();
    ctx.restore();
    // haze along the arc between consecutive fixes
    if (i > 0 && params.arcHaze > 0) {
      hazeAlongLine(ctx, xAt(i - 1), yAt(PTS[i - 1][2]), x, y,
        { samples: 4, jitter: 6, alpha: 0.06 * params.arcHaze * (0.5 + level), dpr });
    }
  }

  // baseline with one tick per revealed fix
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, yBot + 14); ctx.lineTo(x0 + (x1 - x0) * progress, yBot + 14); ctx.stroke();
  ctx.restore();

  // onset rings at the head
  if (onset("low")) {
    rings.push({ x: xAt(headI), y: yAt(PTS[headI][2]), r: 10, a: 0.5 });
  }
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const ring of rings) {
    ring.r += dt * 260; ring.a *= Math.pow(0.14, dt);
    ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, ring.a).toFixed(3)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  rings = rings.filter(r => r.a > 0.01);
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  tickInputs(dt);
  frame(t, dt);
  requestAnimationFrame(loop);
}
installInputs();
installPanel(params);
requestAnimationFrame(loop);

window.addEventListener("click", (e) => {
  if (e.target.closest("#panel")) return;
  bumpActivity();
});
</script>
</body>
</html>
